<!doctype html>
<html lang="it">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#12161B" />
    <meta name="color-scheme" content="dark" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Gimmo" />
    <title>Gimmo</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" />
    <style>
      :root { color-scheme: dark; }
      html, body, #root { height: 100%; }
      body {
        margin: 0;
        background: #12161b;
        color: #e9eef3;
        overscroll-behavior: none;
        -webkit-text-size-adjust: 100%;
      }
      @media (display-mode: standalone) {
        body { -webkit-user-select: none; user-select: none; }
        input, textarea { -webkit-user-select: text; user-select: text; }
      }
      #avvio {
        position: fixed; inset: 0; padding: 28px 22px;
        font-family: system-ui, -apple-system, sans-serif;
        font-size: 14px; line-height: 1.6; color: #8FA0B0;
        overflow-y: auto; -webkit-user-select: text; user-select: text;
      }
      #avvio h1 { font-size: 17px; color: #E9EEF3; margin: 0 0 16px; font-weight: 600; }
      #avvio .riga { display: flex; gap: 8px; margin-bottom: 4px; }
      #avvio .riga b { color: #E9EEF3; font-weight: 500; }
      #avvio .ok { color: #4FA96B; }
      #avvio .ko { color: #D95C55; }
      #avvio .dettaglio {
        margin-top: 18px; padding: 12px 14px; border-left: 3px solid #D95C55;
        background: #1B2128; color: #E9EEF3; font-size: 13px;
        white-space: pre-wrap; word-break: break-word;
      }
      #avvio .aiuto { margin-top: 14px; font-size: 13px; }
    </style>
  </head>
  <body>
    <div id="root"></div>

    <div id="avvio">
      <h1>Avvio di Gimmo</h1>
      <div id="passi"></div>
      <div id="dettaglio"></div>
    </div>

    <!-- ------------------------------------------------------------------
         VERSIONE DI PROVA.
         React e il traduttore del codice vengono scaricati da internet a ogni
         apertura: comoda per provare subito, lenta all'avvio e inutilizzabile
         senza rete. La versione definitiva si costruisce con Vite.

         Il caricamento è scritto a mano invece di usare semplici tag <script>
         per un motivo solo: se qualcosa non arriva, deve dirlo a schermo.
         Una pagina che resta bianca non si può riparare a distanza.
         ------------------------------------------------------------------ -->
    <script>
      (function () {
        var passi = document.getElementById("passi");
        var dettaglio = document.getElementById("dettaglio");
        var finito = false;

        function segna(testo) {
          var d = document.createElement("div");
          d.className = "riga";
          d.innerHTML = '<b>' + testo + '</b><span class="stato">…</span>';
          passi.appendChild(d);
          return d.querySelector(".stato");
        }

        function errore(titolo, dettagliTecnici, aiuto) {
          if (finito) return;
          finito = true;
          dettaglio.innerHTML =
            '<div class="dettaglio"><b>' + titolo + '</b>\n\n' + (dettagliTecnici || "") + "</div>" +
            (aiuto ? '<div class="aiuto">' + aiuto + "</div>" : "");
        }

        // Ogni libreria ha più indirizzi: se il primo non risponde si prova il
        // successivo. Le versioni sono fissate di proposito — "l'ultima
        // disponibile" è una variabile che non controlliamo.
        var LIBRERIE = [
          {
            nome: "React",
            controlla: function () { return typeof window.React !== "undefined"; },
            url: [
              "https://unpkg.com/react@18.3.1/umd/react.production.min.js",
              "https://cdn.jsdelivr.net/npm/react@18.3.1/umd/react.production.min.js"
            ]
          },
          {
            nome: "React DOM",
            controlla: function () { return typeof window.ReactDOM !== "undefined"; },
            url: [
              "https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js",
              "https://cdn.jsdelivr.net/npm/react-dom@18.3.1/umd/react-dom.production.min.js"
            ]
          },
          {
            nome: "Traduttore del codice",
            controlla: function () { return typeof window.Babel !== "undefined"; },
            url: [
              "https://unpkg.com/@babel/standalone@7.24.7/babel.min.js",
              "https://cdn.jsdelivr.net/npm/@babel/standalone@7.24.7/babel.min.js",
              "https://unpkg.com/@babel/standalone/babel.min.js"
            ]
          }
        ];

        function carica(lib, indice, stato, poi) {
          if (indice >= lib.url.length) {
            stato.textContent = "non arrivato";
            stato.className = "stato ko";
            errore(
              "Non riesco a scaricare " + lib.nome + ".",
              "Indirizzi provati:\n" + lib.url.join("\n"),
              "Quasi sempre è la connessione. Prova così, in ordine:<br>" +
                "1. controlla di essere online<br>" +
                "2. passa dal Wi-Fi ai dati (o viceversa)<br>" +
                "3. se sei sulla rete della palestra o dell'ufficio, potrebbe bloccare questi indirizzi: prova con i dati del telefono"
            );
            return;
          }
          var s = document.createElement("script");
          s.src = lib.url[indice];
          s.async = false;
          s.onload = function () {
            if (!lib.controlla()) {
              carica(lib, indice + 1, stato, poi);
              return;
            }
            stato.textContent = "ok";
            stato.className = "stato ok";
            poi();
          };
          s.onerror = function () { carica(lib, indice + 1, stato, poi); };
          document.head.appendChild(s);
        }

        function prossima(i) {
          if (i >= LIBRERIE.length) return avvia();
          var lib = LIBRERIE[i];
          var stato = segna("Scarico " + lib.nome);
          carica(lib, 0, stato, function () { prossima(i + 1); });
        }

        function avvia() {
          var stato = segna("Preparo l'app");
          try {
            // Babel cerca da solo i blocchi di codice da tradurre, ma solo se
            // è già presente quando la pagina finisce di caricarsi. Qui arriva
            // dopo, quindi glielo si chiede a mano.
            window.Babel.transformScriptTags();
            stato.textContent = "ok";
            stato.className = "stato ok";
          } catch (e) {
            stato.textContent = "errore";
            stato.className = "stato ko";
            errore(
              "Il codice di Gimmo non è stato tradotto correttamente.",
              String((e && e.message) || e),
              "Questo è un errore nel file: mandami il testo qui sopra."
            );
          }
        }

        window.addEventListener("error", function (ev) {
          var m = ev && ev.message ? ev.message : "errore sconosciuto";
          var dove = ev && ev.lineno ? "\n\nriga " + ev.lineno : "";
          errore("Gimmo si è fermato durante l'avvio.", m + dove, "Mandami il testo qui sopra.");
        });

        // Se dopo 25 secondi non è successo niente, meglio dirlo.
        setTimeout(function () {
          if (!document.getElementById("root").firstChild) {
            errore(
              "L'avvio sta impiegando troppo.",
              "Le librerie pesano circa 3 MB: con una connessione lenta può volerci un minuto.",
              "Aspetta ancora un po'. Se non cambia nulla, ricarica la pagina stando sotto Wi-Fi."
            );
          }
        }, 25000);

        prossima(0);
      })();
    </script>

    <script type="text/babel" data-presets="react">
      const { useState, useEffect, useRef, useCallback, useMemo } = React;

      /* ------------------------------------------------------------------ *
       * Gimmo — tracker allenamenti
       * Dati salvati localmente e persistenti tra le sessioni.
       * ------------------------------------------------------------------ */

      const DATA_KEY = "gimmo:data:v1";
      const ACTIVE_KEY = "gimmo:active:v1";
      const QUARANTINE_PREFIX = "gimmo:illeggibile:";

      // Versione della forma dei dati salvati, non dell'app.
      // Va alzata solo quando cambia la struttura di esercizi/schede/sessioni,
      // e ogni salto va gestito in migrate(): lo storico di un utente non si butta.
      const SCHEMA_VERSION = 2;

      // Etichetta visibile in fondo allo Storico. Serve a sapere dal telefono
      // quale versione stai usando, senza dover aprire il codice.
      const APP_VERSION = "17 settembre 2026 · lotto 5";

      // Recupero proposto quando non ne è stato scelto uno. Unico punto da
      // cambiare: vale per le schede e per gli esercizi aggiunti al volo.
      const REST_DEFAULT = 60;

      // Secondi di preparazione prima di un esercizio a tempo.
      const PREP_SECONDS = 5;

      const emptyData = () => ({
        schemaVersion: SCHEMA_VERSION,
        exercises: [],
        routines: [],
        sessions: [],
        programs: [],
      });

      const C = {
        bg: "#12161B",
        surface: "#1B2128",
        surface2: "#232C36",
        line: "#333E4A",
        text: "#E9EEF3",
        muted: "#8FA0B0",
        blue: "#2A72E0",
        yellow: "#F2B441",
        green: "#4FA96B",
        red: "#D95C55",
      };

      const uid = () => Math.random().toString(36).slice(2, 10);
      const todayISO = () => new Date().toISOString();

      function fmtClock(ms) {
        const s = Math.max(0, Math.round(ms / 1000));
        return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}`;
      }
      function fmtRest(sec) {
        if (sec == null) return "—";
        if (sec < 60) return `${sec}s`;
        const m = Math.floor(sec / 60);
        const r = sec % 60;
        return r ? `${m}′${String(r).padStart(2, "0")}` : `${m}′`;
      }
      function fmtDate(iso) {
        const d = new Date(iso);
        return d.toLocaleDateString("it-IT", { day: "numeric", month: "short", year: "numeric" });
      }
      function fmtDateShort(iso) {
        return new Date(iso).toLocaleDateString("it-IT", { day: "2-digit", month: "2-digit" });
      }

      // Una serie può essere di tre tipi: carico × ripetizioni, a cedimento (max),
      // oppure a tempo. Un solo punto di formattazione per chip, storico e
      // riepiloghi, così non si disallineano mai tra loro.
      function fmtSet(set, short = false) {
        if (set.d != null) return `${set.d}s`;
        const load = set.w != null ? `${set.w}kg` : short ? "cl" : "corpo libero";
        if (set.max) return `${load} × ${set.r != null ? `${set.r} max` : "max"}`;
        return set.r != null ? `${load} × ${set.r}` : load;
      }

      // Voce di sistema. La prima frase parte sempre da un tocco dell'utente
      // (il tasto Avvia): su iPhone è quel tocco a sbloccare la sintesi vocale
      // per tutte le frasi successive, che arrivano invece dal timer.
      function say(text) {
        try {
          const synth = window.speechSynthesis;
          if (!synth) return;
          const u = new SpeechSynthesisUtterance(text);
          u.lang = "it-IT";
          u.rate = 1.05;
          synth.cancel();
          synth.speak(u);
        } catch (e) {}
      }

      /* ----------------------------- persistenza ---------------------------- *
       * Gimmo deve girare in ambienti diversi (anteprima, browser, in futuro app
       * nativa) e in ognuno il posto dove salvare cambia. Qui sotto c'è un solo
       * punto di contatto con lo spazio di archiviazione: il resto dell'app non sa
       * e non deve sapere dove finiscono i dati.
       * Regola guida: un allenamento registrato non si perde e non si sovrascrive
       * mai in silenzio. Se qualcosa non torna, i salvataggi si fermano e l'utente
       * lo viene a sapere.
       * -------------------------------------------------------------------- */

      const memoryStore = new Map();

      const store = (() => {
        // 1. Ambiente di anteprima: espone window.storage.
        if (typeof window !== "undefined" && window.storage && typeof window.storage.get === "function") {
          return {
            kind: "preview",
            durable: true,
            get: async (k) => {
              const r = await window.storage.get(k);
              return r && r.value != null ? r.value : null;
            },
            set: async (k, v) => {
              await window.storage.set(k, v);
            },
            remove: async (k) => {
              await window.storage.delete(k);
            },
            list: async (prefix) => {
              const r = await window.storage.list(prefix);
              return r && Array.isArray(r.keys) ? r.keys : [];
            },
          };
        }

        // 2. Browser normale. La scrittura di prova non è superflua: in navigazione
        //    privata su Safari localStorage esiste ma scrivere lancia un errore, e
        //    scoprirlo adesso è meglio che scoprirlo a metà allenamento.
        try {
          if (typeof window !== "undefined" && window.localStorage) {
            const probe = "gimmo:prova";
            window.localStorage.setItem(probe, "1");
            window.localStorage.removeItem(probe);
            return {
              kind: "browser",
              durable: true,
              get: async (k) => window.localStorage.getItem(k),
              set: async (k, v) => window.localStorage.setItem(k, v),
              remove: async (k) => window.localStorage.removeItem(k),
              list: async (prefix) => {
                const out = [];
                for (let i = 0; i < window.localStorage.length; i++) {
                  const k = window.localStorage.key(i);
                  if (k && k.startsWith(prefix)) out.push(k);
                }
                return out;
              },
            };
          }
        } catch (e) {
          /* non disponibile: si scende al livello successivo */
        }

        // 3. Nessuno spazio scrivibile. L'app funziona comunque, ma i dati vivono
        //    solo finché la pagina resta aperta: durable a false accende l'avviso.
        return {
          kind: "memoria",
          durable: false,
          get: async (k) => (memoryStore.has(k) ? memoryStore.get(k) : null),
          set: async (k, v) => {
            memoryStore.set(k, v);
          },
          remove: async (k) => {
            memoryStore.delete(k);
          },
          list: async (prefix) => [...memoryStore.keys()].filter((k) => k.startsWith(prefix)),
        };
      })();

      // Legge una chiave distinguendo i tre casi che contano:
      // vuota (primo avvio), leggibile, illeggibile (dato corrotto).
      // La differenza non è accademica: su "vuota" si può scrivere, su
      // "illeggibile" no, altrimenti il salvataggio automatico cancella lo storico.
      async function readRecord(key) {
        let raw = null;
        try {
          raw = await store.get(key);
        } catch (e) {
          // window.storage.get solleva un errore quando la chiave non esiste
          // invece di restituire null: al primo avvio questo è il percorso normale.
          return { status: "vuoto" };
        }
        if (raw == null || raw === "") return { status: "vuoto" };
        try {
          return { status: "ok", value: JSON.parse(raw), raw };
        } catch (e) {
          return { status: "illeggibile", raw };
        }
      }

      async function writeRecord(key, value) {
        try {
          await store.set(key, JSON.stringify(value));
          return { ok: true };
        } catch (e) {
          const pieno =
            e &&
            (e.name === "QuotaExceededError" ||
              e.name === "NS_ERROR_DOM_QUOTA_REACHED" ||
              e.code === 22);
          console.error("gimmo: salvataggio fallito", store.kind, e);
          return { ok: false, reason: pieno ? "spazio" : "scrittura" };
        }
      }

      // Mette da parte una copia grezza del dato illeggibile prima di qualunque
      // altra operazione. Non serve all'app: serve a poter recuperare a mano.
      async function quarantine(raw) {
        try {
          await store.set(QUARANTINE_PREFIX + Date.now(), raw);
        } catch (e) {
          /* se non si riesce nemmeno a metterlo da parte, pazienza: non si scrive comunque */
        }
      }

      // Porta un dato salvato da una versione precedente alla forma corrente.
      // Oggi c'è un solo salto (schema assente → 1); la struttura a catena serve
      // perché i salti futuri si aggiungano senza toccare quelli vecchi.
      function migrate(stored) {
        if (!stored || typeof stored !== "object" || Array.isArray(stored)) {
          return { ok: false, reason: "formato" };
        }
        let d = stored;
        let v = typeof d.schemaVersion === "number" ? d.schemaVersion : 0;

        if (v === 0) {
          d = { ...d, schemaVersion: 1 };
          v = 1;
        }
        // 1 → 2: nascono i programmi, cioè i cicli di schede che si alternano.
        // Chi aggiorna non ne ha nessuno: lista vuota e nient'altro da toccare.
        // Esercizi, schede e allenamenti restano intatti.
        if (v === 1) {
          d = { ...d, programs: Array.isArray(d.programs) ? d.programs : [], schemaVersion: 2 };
          v = 2;
        }

        if (v > SCHEMA_VERSION) {
          // Dati scritti da una versione più recente di Gimmo: leggerli male e
          // risalvarli significherebbe rovinarli. Meglio fermarsi.
          return { ok: false, reason: "futuro" };
        }

        // Un campo assente è normale (archivio nuovo, o scritto da una versione che
        // ancora non lo aveva) e vale lista vuota. Un campo presente ma del tipo
        // sbagliato no: è il segno che il dato è rovinato, e azzerarlo in silenzio
        // vorrebbe dire cancellare lo storico. In quel caso ci si ferma.
        const campi = {};
        for (const nome of ["exercises", "routines", "sessions", "programs"]) {
          const v = d[nome];
          if (v === undefined || v === null) campi[nome] = [];
          else if (Array.isArray(v)) campi[nome] = v;
          else return { ok: false, reason: "formato" };
        }

        return { ok: true, data: { schemaVersion: SCHEMA_VERSION, ...campi } };
      }

      // Unico punto di ingresso al caricamento dell'archivio.
      // Restituisce anche se è lecito scrivere: chi chiama non deve ragionarci.
      async function loadArchive() {
        const rec = await readRecord(DATA_KEY);

        if (rec.status === "vuoto") {
          return { data: emptyData(), writable: true, issue: null };
        }
        if (rec.status === "illeggibile") {
          await quarantine(rec.raw);
          return { data: emptyData(), writable: false, issue: "illeggibile" };
        }

        const m = migrate(rec.value);
        if (!m.ok) {
          if (m.reason !== "futuro") await quarantine(rec.raw);
          return { data: emptyData(), writable: false, issue: m.reason === "futuro" ? "futuro" : "illeggibile" };
        }
        return { data: m.data, writable: true, issue: null };
      }

      // La sessione in corso è un dato di comodo, non l'archivio: se è rovinata si
      // scarta e si riparte, senza bloccare i salvataggi dello storico.
      async function loadActive() {
        const rec = await readRecord(ACTIVE_KEY);
        if (rec.status !== "ok") return null;
        const a = rec.value;
        return a && a.session && Array.isArray(a.session.entries) ? a : null;
      }

      /* ------------------------------- backup ------------------------------ *
       * Il backup non è una funzione accessoria: è l'unica cosa che rende
       * sopportabile un cambio di telefono, una cache svuotata da Safari o un
       * archivio finito in quarantena. Il file è leggibile a occhio di proposito,
       * così resta recuperabile anche senza Gimmo.
       * -------------------------------------------------------------------- */

      const EXPORT_FORMAT = 1;
      const ROLLBACK_PREFIX = "gimmo:prima-del-ripristino:";

      function buildExport(data) {
        return {
          app: "gimmo",
          exportFormat: EXPORT_FORMAT,
          exportedAt: todayISO(),
          data: { ...data, schemaVersion: SCHEMA_VERSION },
        };
      }

      function exportFilename(d = new Date()) {
        const p = (n) => String(n).padStart(2, "0");
        return `gimmo-${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}.json`;
      }

      // Accetta sia il file di backup completo sia l'archivio nudo: chi apre il file
      // e ne incolla un pezzo non deve essere punito per questo.
      function parseBackup(text) {
        let parsed;
        try {
          parsed = JSON.parse(text);
        } catch (e) {
          return { ok: false, reason: "json" };
        }
        if (!parsed || typeof parsed !== "object" || Array.isArray(parsed)) {
          return { ok: false, reason: "json" };
        }
        if (parsed.app && parsed.app !== "gimmo") return { ok: false, reason: "altra-app" };
        if (typeof parsed.exportFormat === "number" && parsed.exportFormat > EXPORT_FORMAT) {
          return { ok: false, reason: "futuro" };
        }
        const payload = parsed.data && typeof parsed.data === "object" ? parsed.data : parsed;
        const m = migrate(payload);
        if (!m.ok) return { ok: false, reason: m.reason };
        return { ok: true, data: m.data, exportedAt: typeof parsed.exportedAt === "string" ? parsed.exportedAt : null };
      }

      // Il confronto tra nomi deve perdonare quello che perdona l'occhio: spazi
      // doppi, maiuscole, apostrofi tipografici. "Panca  piana" e "panca piana"
      // sono lo stesso esercizio per chi si allena, e devono esserlo anche qui.
      const normName = (s) =>
        String(s || "")
          .replace(/[\u2018\u2019\u02BC]/g, "'")
          .replace(/\s+/g, " ")
          .trim()
          .toLowerCase();

      // Unisce due archivi senza creare doppioni. Il caso che conta davvero:
      // stesso esercizio creato su due telefoni con id diversi ma stesso nome.
      // Se non lo si gestisse, dopo un'unione ci si ritroverebbe due "Panca piana"
      // con lo storico spezzato a metà — il modo più veloce per far disinstallare l'app.
      function mergeArchives(current, incoming) {
        const exercises = [...current.exercises];
        const byId = new Map(exercises.map((e) => [e.id, e]));
        const byName = new Map(exercises.map((e) => [normName(e.name), e]));
        const remap = new Map();
        let nuoviEsercizi = 0;

        for (const e of incoming.exercises) {
          if (!e || !e.id) continue;
          if (byId.has(e.id)) {
            remap.set(e.id, e.id);
            continue;
          }
          const omonimo = byName.get(normName(e.name));
          if (omonimo) {
            remap.set(e.id, omonimo.id);
            continue;
          }
          exercises.push(e);
          byId.set(e.id, e);
          byName.set(normName(e.name), e);
          remap.set(e.id, e.id);
          nuoviEsercizi += 1;
        }

        const fix = (id) => remap.get(id) || id;

        const routines = [...current.routines];
        const routineIds = new Set(routines.map((r) => r.id));
        let nuoveSchede = 0;
        for (const r of incoming.routines) {
          if (!r || !r.id || routineIds.has(r.id)) continue;
          routines.push({ ...r, items: (r.items || []).map((it) => ({ ...it, exerciseId: fix(it.exerciseId) })) });
          routineIds.add(r.id);
          nuoveSchede += 1;
        }

        const sessions = [...current.sessions];
        const sessionIds = new Set(sessions.map((s) => s.id));
        let nuoviAllenamenti = 0;
        for (const s of incoming.sessions) {
          if (!s || !s.id || sessionIds.has(s.id)) continue;
          sessions.push({ ...s, entries: (s.entries || []).map((en) => ({ ...en, exerciseId: fix(en.exerciseId) })) });
          sessionIds.add(s.id);
          nuoviAllenamenti += 1;
        }

        sessions.sort((a, b) => new Date(a.startedAt) - new Date(b.startedAt));

        // I programmi puntano alle schede per id, e le schede qui non vengono
        // mai rinumerate: basta non duplicarli. Senza questo blocco, ripristinare
        // un backup farebbe sparire in silenzio tutti i cicli.
        const programs = [...(current.programs || [])];
        const programIds = new Set(programs.map((p) => p.id));
        let nuoviProgrammi = 0;
        for (const p of incoming.programs || []) {
          if (!p || !p.id || programIds.has(p.id)) continue;
          programs.push(p);
          programIds.add(p.id);
          nuoviProgrammi += 1;
        }

        return {
          data: { schemaVersion: SCHEMA_VERSION, exercises, routines, sessions, programs },
          added: {
            exercises: nuoviEsercizi,
            routines: nuoveSchede,
            sessions: nuoviAllenamenti,
            programs: nuoviProgrammi,
          },
        };
      }

      // Prima di sovrascrivere l'archivio con un ripristino si mette via com'era.
      // Costa una scrittura e vale un ripensamento.
      async function saveRollback(data) {
        try {
          await store.set(ROLLBACK_PREFIX + Date.now(), JSON.stringify(buildExport(data)));
        } catch (e) {
          /* non blocca il ripristino */
        }
      }

      async function listSalvataggiDiEmergenza() {
        const raccolta = [];
        for (const [prefix, tipo] of [
          [QUARANTINE_PREFIX, "illeggibile"],
          [ROLLBACK_PREFIX, "prima-del-ripristino"],
        ]) {
          let keys = [];
          try {
            keys = await store.list(prefix);
          } catch (e) {
            keys = [];
          }
          for (const k of keys) {
            const ts = Number(k.slice(prefix.length));
            raccolta.push({ key: k, tipo, at: Number.isFinite(ts) ? ts : null });
          }
        }
        return raccolta.sort((a, b) => (b.at || 0) - (a.at || 0));
      }

      async function readRaw(key) {
        try {
          return await store.get(key);
        } catch (e) {
          return null;
        }
      }

      async function removeKey(key) {
        try {
          await store.remove(key);
          return true;
        } catch (e) {
          return false;
        }
      }

      /* Salvataggio del file. Su iPhone il foglio di condivisione è l'unico modo
       * affidabile per far finire un file dentro l'app File o su iCloud; il download
       * classico resta per il desktop; il testo da copiare è la rete sotto la rete. */
      async function saveTextAsFile(filename, text) {
        const blob = new Blob([text], { type: "application/json" });

        try {
          if (typeof File !== "undefined" && navigator.canShare) {
            const file = new File([blob], filename, { type: "application/json" });
            if (navigator.canShare({ files: [file] })) {
              await navigator.share({ files: [file], title: filename });
              return { ok: true, via: "condivisione" };
            }
          }
        } catch (e) {
          if (e && e.name === "AbortError") return { ok: true, via: "annullato" };
        }

        try {
          const url = URL.createObjectURL(blob);
          const a = document.createElement("a");
          a.href = url;
          a.download = filename;
          document.body.appendChild(a);
          a.click();
          a.remove();
          setTimeout(() => URL.revokeObjectURL(url), 2000);
          return { ok: true, via: "download" };
        } catch (e) {
          return { ok: false };
        }
      }

      async function copyText(text) {
        try {
          if (navigator.clipboard && navigator.clipboard.writeText) {
            await navigator.clipboard.writeText(text);
            return true;
          }
        } catch (e) {
          /* si prova la via vecchia */
        }
        try {
          const ta = document.createElement("textarea");
          ta.value = text;
          ta.style.position = "fixed";
          ta.style.opacity = "0";
          document.body.appendChild(ta);
          ta.select();
          const ok = document.execCommand("copy");
          ta.remove();
          return ok;
        } catch (e) {
          return false;
        }
      }

      /* ---------------------------- statistiche ---------------------------- */

      function setVolume(s) {
        if (s.w == null || s.r == null) return 0;
        return s.w * s.r;
      }

      function exerciseStats(sessions, exerciseId) {
        const points = [];
        let best = null;
        let bestSet = null;
        let totalSets = 0;
        let totalTime = 0;
        for (const ses of sessions) {
          for (const en of ses.entries) {
            if (en.exerciseId !== exerciseId || en.sets.length === 0) continue;
            let top = null;
            let vol = 0;
            for (const s of en.sets) {
              totalSets += 1;
              vol += setVolume(s);
              if (s.d != null) totalTime += s.d;
              if (s.w != null && (top == null || s.w > top)) top = s.w;
              if (s.w != null && (best == null || s.w > best)) {
                best = s.w;
                bestSet = { ...s, date: ses.startedAt };
              }
            }
            points.push({ date: ses.startedAt, top, vol, reps: en.sets.length });
          }
        }
        points.sort((a, b) => new Date(a.date) - new Date(b.date));
        return { points, best, bestSet, totalSets, totalTime, sessions: points.length };
      }

      function lastPerformance(sessions, exerciseId) {
        const ordered = [...sessions].sort((a, b) => new Date(b.startedAt) - new Date(a.startedAt));
        for (const ses of ordered) {
          for (const en of ses.entries) {
            if (en.exerciseId === exerciseId && en.sets.length) {
              return { date: ses.startedAt, sets: en.sets };
            }
          }
        }
        return null;
      }

      // Con `editable` il numero al centro si può toccare e scrivere: le frecce
      // restano per i passi comodi, la tastiera serve ai carichi fini (61,25).
      // Mentre scrivi tengo il testo grezzo in `draft` e non converto nulla:
      // convertire a ogni tasto impedirebbe di digitare "6," o di svuotare il campo.
      function Stepper({ value, onChange, step = 1, min = 0, suffix = "", decimals = 0, width = 92, editable = false }) {
        const [draft, setDraft] = useState(null);
        const dec = () => onChange(Math.max(min, +(value - step).toFixed(2)));
        const inc = () => onChange(+(value + step).toFixed(2));

        const mostrato = decimals ? String(value.toFixed(decimals)).replace(/\.0$/, "") : String(value);

        // La virgola è quello che esce dalla tastiera italiana, il punto è quello
        // che capisce JavaScript. Un valore non valido non cambia niente.
        const conferma = () => {
          if (draft == null) return;
          const n = parseFloat(draft.replace(",", "."));
          setDraft(null);
          if (!Number.isFinite(n)) return;
          onChange(Math.max(min, +n.toFixed(2)));
        };

        const numero = {
          width,
          textAlign: "center",
          fontFamily: "'Barlow Condensed', sans-serif",
          fontSize: 30,
          fontWeight: 600,
          fontVariantNumeric: "tabular-nums",
          color: C.text,
          lineHeight: 1,
        };

        return (
          <div style={{ display: "flex", alignItems: "center", gap: 6 }}>
            <button onClick={dec} aria-label="riduci" style={stepBtn}>
              −
            </button>
            {editable ? (

                <input

                  inputMode="decimal"
                  value={draft ?? mostrato}
                  onChange={(e) => setDraft(e.target.value)}
                  onFocus={(e) => e.target.select()}
                  onBlur={conferma}
                  onKeyDown={(e) => e.key === "Enter" && e.target.blur()}
                  aria-label="valore"
                  style={{
                    ...numero,
                    background: "transparent",
                    border: "none",
                    borderBottom: `1px solid ${C.line}`,
                    padding: "2px 0",
                    outline: "none",
                    boxSizing: "border-box",
                  }}
                />
                <span style={{ fontSize: 14, color: C.muted, marginLeft: 3 }}>{suffix}</span>
              </div>
            ) : (
              <div style={numero}>
                {mostrato}
                <span style={{ fontSize: 14, color: C.muted, marginLeft: 3 }}>{suffix}</span>
              </div>
            )}
            <button onClick={inc} aria-label="aumenta" style={stepBtn}>
              +
            </button>

        );

      // Quando la tastiera si apre, la finestra del browser non cambia: cambia
      // solo la porzione che resti a vedere. `visualViewport` è l'unica cosa che
      // la conosce. Senza questo, un pannello fissato resta dov'era e la tastiera
      // ci finisce sopra — e iOS prova a rimediare scorrendo tutta la pagina.
      function useVisualViewport() {
        const leggi = () => {
          const vv = typeof window !== "undefined" ? window.visualViewport : null;
          return vv ? { h: vv.height, top: vv.offsetTop } : { h: window.innerHeight, top: 0 };
        };
        const [vp, setVp] = useState(leggi);
        useEffect(() => {
          const vv = typeof window !== "undefined" ? window.visualViewport : null;
          if (!vv) return;
          const aggiorna = () => setVp(leggi());
          vv.addEventListener("resize", aggiorna);
          vv.addEventListener("scroll", aggiorna);
          return () => {
            vv.removeEventListener("resize", aggiorna);
            vv.removeEventListener("scroll", aggiorna);
          };
        }, []);
        return vp;
      }

      // `sticky` è una zona che resta ancorata in alto mentre il resto scorre:
      // serve per i campi di ricerca, che non devono muoversi sotto le dita.
      // `anchor="top"` attacca il foglio in cima: la tastiera sale dal basso,
      // quindi un campo di testo va messo il più lontano possibile da lì.
      function Sheet({ open, onClose, title, sticky, anchor = "bottom", children }) {
        // L'hook va chiamato sempre, anche a foglio chiuso: React pretende che
        // il numero di hook non cambi tra un disegno e l'altro.
        const vp = useVisualViewport();
        if (!open) return null;
        const alto = anchor === "top";
        return (

            style={{
              position: "fixed",
              left: 0,
              right: 0,
              top: vp.top,

                borderRadius: alto ? "0 0 16px 16px" : "16px 16px 0 0",
                width: "100%",
                maxWidth: 520,
                maxHeight: Math.max(160, vp.h - 12),
                overflowY: "auto",
                padding: "0 18px 28px",
                boxSizing: "border-box",
              }}
            >
              <div
                style={{
                  position: "sticky",
                  top: 0,
                  zIndex: 2,
                  background: C.surface,
                  margin: "0 -18px",
                  padding: "18px 18px 12px",

      }

      function Sparkline({ points, valueKey }) {
        const vals = points.map((p) => p[valueKey]).filter((v) => v != null && v > 0);
        if (vals.length < 2) return null;
        const w = 260;
        const h = 54;
        const min = Math.min(...vals);
        const max = Math.max(...vals);
        const span = max - min || 1;
        const coords = vals.map((v, i) => {
          const x = (i / (vals.length - 1)) * (w - 6) + 3;
          const y = h - 6 - ((v - min) / span) * (h - 14);
          return [x, y];
        });
        const d = coords.map(([x, y], i) => `${i ? "L" : "M"}${x.toFixed(1)},${y.toFixed(1)}`).join(" ");
        const [lx, ly] = coords[coords.length - 1];
        return (
          <svg viewBox={`0 0 ${w} ${h}`} width="100%" height={h} style={{ display: "block" }}>
            <path d={d} fill="none" stroke={C.blue} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" />
            <circle cx={lx} cy={ly} r="3.5" fill={C.yellow} />
          </svg>
        );
      }

      /* --------------------- avviso stato archiviazione --------------------- *
       * Se i dati non si stanno salvando, l'utente deve saperlo mentre si allena,
       * non scoprirlo la settimana dopo. Deliberatamente non si può chiudere.
       * -------------------------------------------------------------------- */

      const PERSISTENCE_MESSAGES = {
        volatile: {
          tone: "warn",
          title: "Gli allenamenti non vengono salvati",
          body: "Su questo dispositivo l'archivio non è disponibile: quello che registri sparisce chiudendo la pagina. Salva un backup da Storico › Backup prima di chiudere, e se stai usando la navigazione privata riapri Gimmo in una finestra normale.",
        },
        illeggibile: {
          tone: "stop",
          title: "Archivio non leggibile",
          body: "I dati salvati sono danneggiati e i salvataggi restano sospesi per non sovrascriverli. Vai su Storico › Backup: trovi la copia messa da parte, e da lì puoi ripristinare un backup o ripartire da zero.",
        },
        futuro: {
          tone: "stop",
          title: "Archivio di una versione più recente",
          body: "I dati salvati arrivano da una versione più recente di Gimmo. I salvataggi sono sospesi per non danneggiarli: aggiorna l'app e riapri.",
        },
        spazio: {
          tone: "stop",
          title: "Spazio esaurito",
          body: "Non c'è più spazio per salvare. Libera spazio sul dispositivo, poi registra una serie per riprovare.",
        },
        scrittura: {
          tone: "warn",
          title: "Ultimo salvataggio non riuscito",
          body: "Le ultime serie potrebbero non essere state salvate. Registrane un'altra per forzare un nuovo tentativo, e intanto salva un backup da Storico › Backup.",
        },
      };

      function PersistenceNotice({ issue }) {
        const msg = issue ? PERSISTENCE_MESSAGES[issue] : null;
        if (!msg) return null;
        const accent = msg.tone === "stop" ? C.red : C.yellow;
        return (
          <div
            role="status"
            style={{
              borderLeft: `3px solid ${accent}`,
              background: C.surface,
              padding: "12px 14px 13px",
              margin: "0 0 2px",
            }}
          >
            <div style={{ fontSize: 14, fontWeight: 600, color: accent, marginBottom: 3 }}>{msg.title}</div>
            <div style={{ fontSize: 13, color: C.muted, lineHeight: 1.45 }}>{msg.body}</div>
          </div>
        );
      }

      /* ------------------------------ App root ----------------------------- */

      function Gimmo() {
        const [loaded, setLoaded] = useState(false);
        const [data, setData] = useState(emptyData);
        const [active, setActive] = useState(null); // { session, timer }
        const [tab, setTab] = useState("allena");
        const [now, setNow] = useState(Date.now());
        // writable dice se è lecito scrivere sull'archivio; issue è il motivo da
        // mostrare quando non lo è (o quando lo spazio non è duraturo).
        const [persistence, setPersistence] = useState({
          writable: true,
          issue: store.durable ? null : "volatile",
        });
        const audioRef = useRef(null);
        const firedRef = useRef(false);
        const tickRef = useRef(null);

        useEffect(() => {
          let annullato = false;
          (async () => {
            const archive = await loadArchive();
            const a = await loadActive();
            if (annullato) return;
            setData(archive.data);
            if (a) setActive(a);
            setPersistence((p) => ({
              writable: archive.writable,
              issue: archive.issue || p.issue,
            }));
            setLoaded(true);
          })();
          return () => {
            annullato = true;
          };
        }, []);

        // I salvataggi sono ritardati di qualche centinaio di millisecondi: durante
        // una serie lo stato cambia a raffica e serializzare tutto l'archivio a ogni
        // tocco fa scattare il telefono. Il ritardo sull'archivio è più lungo, quello
        // sulla sessione in corso più corto: è il dato che protegge da un'app chiusa
        // per sbaglio a metà allenamento.
        useEffect(() => {
          if (!loaded || !persistence.writable) return;
          const id = setTimeout(async () => {
            const res = await writeRecord(DATA_KEY, data);
            if (!res.ok) setPersistence((p) => ({ ...p, issue: res.reason }));
          }, 400);
          return () => clearTimeout(id);
        }, [data, loaded, persistence.writable]);

        useEffect(() => {
          if (!loaded || !persistence.writable) return;
          const id = setTimeout(() => {
            writeRecord(ACTIVE_KEY, active);
          }, 150);
          return () => clearTimeout(id);
        }, [active, loaded, persistence.writable]);

        // Il ritardo di cui sopra apre una finestra di mezzo secondo in cui l'ultima
        // serie non è ancora sul disco. Su iPhone l'app può essere chiusa dal sistema
        // appena passa in secondo piano, quindi lì il salvataggio va forzato subito.
        const latest = useRef({ data, active });
        useEffect(() => {
          latest.current = { data, active };
        }, [data, active]);

        useEffect(() => {
          if (!loaded || !persistence.writable) return;
          const flush = () => {
            if (document.visibilityState === "visible") return;
            writeRecord(DATA_KEY, latest.current.data);
            writeRecord(ACTIVE_KEY, latest.current.active);
          };
          // pagehide copre la chiusura della scheda, dove visibilitychange su Safari
          // non è affidabile.
          const onPageHide = () => {
            writeRecord(DATA_KEY, latest.current.data);
            writeRecord(ACTIVE_KEY, latest.current.active);
          };
          document.addEventListener("visibilitychange", flush);
          window.addEventListener("pagehide", onPageHide);
          return () => {
            document.removeEventListener("visibilitychange", flush);
            window.removeEventListener("pagehide", onPageHide);
          };
        }, [loaded, persistence.writable]);

        const timer = active?.timer || null;

        // Il countdown si calcola sull'orario di fine: resta corretto anche
        // se l'app va in secondo piano o cambi schermata.
        useEffect(() => {
          if (!timer) return;
          const id = setInterval(() => setNow(Date.now()), 250);
          const onVis = () => setNow(Date.now());
          document.addEventListener("visibilitychange", onVis);
          return () => {
            clearInterval(id);
            document.removeEventListener("visibilitychange", onVis);
          };
        }, [timer]);

        const remaining = timer ? timer.endsAt - now : 0;

        // Macchina a fasi: preparazione → lavoro → recupero.
        // Ogni fase ha il suo suono e, quando arriva a zero, decide da sola
        // che cosa viene dopo. Il conto resta su un orario di fine assoluto.
        useEffect(() => {
          if (!timer) {
            firedRef.current = false;
            tickRef.current = null;
            return;
          }
          const phase = timer.phase || "rest";

          if (remaining > 0) {
            firedRef.current = false;
            // Il countdown si aggiorna 4 volte al secondo: tickRef ricorda
            // quale secondo ha già suonato, così il bip non si ripete.
            const left = Math.ceil(remaining / 1000);
            const key = `${phase}:${left}`;
            if (tickRef.current !== key) {
              tickRef.current = key;
              // In preparazione si suona ogni secondo; in lavoro e in recupero
              // solo negli ultimi tre, che sono quelli che servono davvero.
              if (phase === "prep" || left <= 3) tick();
            }
            return;
          }

          if (firedRef.current) return;
          firedRef.current = true;

          if (phase === "prep") {
            goTone();
            say("Via");
            setActive((a) =>
              a && a.timer
                ? {
                    ...a,
                    timer: {
                      ...a.timer,
                      phase: "work",
                      endsAt: Date.now() + a.timer.duration * 1000,
                      total: a.timer.duration,
                    },
                  }
                : a
            );
            setNow(Date.now());
            return;
          }

          if (phase === "work") {
            endTone();
            // Dopo un esercizio a tempo quello che serve sapere è cosa viene
            // dopo, non che è finito: se c'è un recupero lo si annuncia.
            say(timer.restAfter ? "Recupero" : "Fine");
            try {
              navigator.vibrate && navigator.vibrate([320, 120, 320]);
            } catch (e) {}
            closeTimedSet(timer.duration);
            return;
          }

          beep();
          try {
            navigator.vibrate && navigator.vibrate([220, 90, 220]);
          } catch (e) {}
        }, [remaining, timer]);

        // Un solo generatore di suono, parametrico. Tutti i segnali dell'app
        // (bip singolo, doppio, nota di partenza, nota di stop) nascono da qui.
        const playTone = useCallback((freq, offset = 0, dur = 0.22, vol = 0.35) => {
          try {
            if (!audioRef.current) {
              const Ctx = window.AudioContext || window.webkitAudioContext;
              audioRef.current = new Ctx();
            }
            const ctx = audioRef.current;
            if (ctx.state === "suspended") ctx.resume();
            const o = ctx.createOscillator();
            const g = ctx.createGain();
            o.type = "sine";
            o.frequency.value = freq;
            g.gain.setValueAtTime(0.0001, ctx.currentTime + offset);
            g.gain.exponentialRampToValueAtTime(vol, ctx.currentTime + offset + 0.02);
            g.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + offset + dur);
            o.connect(g).connect(ctx.destination);
            o.start(ctx.currentTime + offset);
            o.stop(ctx.currentTime + offset + dur + 0.02);
          } catch (e) {}
        }, []);

        const beep = useCallback(() => {
          playTone(880, 0);
          playTone(880, 0.28);
        }, [playTone]);
        const tick = useCallback(() => playTone(620, 0, 0.09, 0.22), [playTone]);
        const goTone = useCallback(() => playTone(1046, 0, 0.4, 0.4), [playTone]);
        const endTone = useCallback(() => {
          playTone(660, 0, 0.5, 0.35);
          playTone(440, 0.12, 0.5, 0.3);
        }, [playTone]);

        const primeAudio = useCallback(() => {
          try {
            if (!audioRef.current) {
              const Ctx = window.AudioContext || window.webkitAudioContext;
              audioRef.current = new Ctx();
            }
            if (audioRef.current.state === "suspended") audioRef.current.resume();
          } catch (e) {}
        }, []);

        /* ----------------------------- mutazioni ---------------------------- */

        const addExercise = (name) => {
          const clean = name.trim();
          if (!clean) return null;
          const existing = data.exercises.find((e) => e.name.toLowerCase() === clean.toLowerCase());
          if (existing) return existing.id;
          const ex = { id: uid(), name: clean, createdAt: todayISO() };
          setData((d) => ({ ...d, exercises: [...d.exercises, ex] }));
          return ex.id;
        };
        const renameExercise = (id, name) =>
          setData((d) => ({ ...d, exercises: d.exercises.map((e) => (e.id === id ? { ...e, name } : e)) }));
        const deleteExercise = (id) =>
          setData((d) => ({ ...d, exercises: d.exercises.filter((e) => e.id !== id) }));

        const saveRoutine = (routine) =>
          setData((d) => {
            const exists = d.routines.some((r) => r.id === routine.id);
            return {
              ...d,
              routines: exists ? d.routines.map((r) => (r.id === routine.id ? routine : r)) : [...d.routines, routine],
            };
          });
        const deleteRoutine = (id) => setData((d) => ({ ...d, routines: d.routines.filter((r) => r.id !== id) }));

        const saveProgram = (program) =>
          setData((d) => {
            const exists = d.programs.some((p) => p.id === program.id);
            return {
              ...d,
              programs: exists
                ? d.programs.map((p) => (p.id === program.id ? program : p))
                : [...d.programs, program],
            };
          });
        const deleteProgram = (id) => setData((d) => ({ ...d, programs: d.programs.filter((p) => p.id !== id) }));

        // Il segnaposto del ciclo. Parte dal giorno appena chiuso, non da dove
        // credeva di essere: così vale anche se ti alleni fuori turno.
        // Arrivato in fondo, il ciclo riparte da capo.
        const moveCursor = (programId, fromIndex) =>
          setData((d) => ({
            ...d,
            programs: d.programs.map((p) =>
              p.id === programId ? { ...p, cursor: p.days.length ? (fromIndex + 1) % p.days.length : 0 } : p
            ),
          }));
        const skipProgramDay = (program) => moveCursor(program.id, program.cursor ?? 0);

        const startSession = (routine, program = null, dayIndex = null) => {
          primeAudio();
          const session = {
            id: uid(),
            startedAt: todayISO(),
            endedAt: null,
            routineId: routine ? routine.id : null,
            programId: program ? program.id : null,
            programDay: program ? dayIndex : null,
            name: routine ? routine.name : "Allenamento libero",
            entries: routine
              ? routine.items.map((it) => ({
                  id: uid(),
                  exerciseId: it.exerciseId,
                  mode: it.mode,
                  targetSets: it.sets,
                  targetReps: it.reps,
                  targetDuration: it.duration,
                  rest: it.rest,
                  sets: [],
                }))
              : [],
          };
          setActive({ session, timer: null });
          setTab("allena");
        };

        const updateSession = (fn) => setActive((a) => (a ? { ...a, session: fn(a.session) } : a));

        const startRest = (seconds, label) => {
          primeAudio();
          setActive((a) =>
            a ? { ...a, timer: { phase: "rest", endsAt: Date.now() + seconds * 1000, total: seconds, label } } : a
          );
          setNow(Date.now());
        };

        // Avvia un esercizio a tempo. Nel timer porto tutto quello che servirà
        // alla fine (quale esercizio, quanto dura, che recupero attaccare), così
        // le fasi successive non devono ripescarlo dalla sessione.
        const startTimed = (entry, label) => {
          primeAudio();
          say("Preparazione");
          const duration = entry.targetDuration || 30;
          setActive((a) =>
            a
              ? {
                  ...a,
                  timer: {
                    phase: "prep",
                    endsAt: Date.now() + PREP_SECONDS * 1000,
                    total: PREP_SECONDS,
                    label,
                    entryId: entry.id,
                    duration,
                    restAfter: entry.rest,
                  },
                }
              : a
          );
          setNow(Date.now());
        };

        // Registra la serie a tempo con la durata effettiva e attacca il recupero.
        // Un solo aggiornamento atomico: serie e timer cambiano insieme.
        const closeTimedSet = (seconds) => {
          setActive((a) => {
            if (!a || !a.timer) return a;
            const t = a.timer;
            const session = {
              ...a.session,
              entries: a.session.entries.map((e) =>
                e.id === t.entryId ? { ...e, sets: [...e.sets, { d: seconds, at: todayISO() }] } : e
              ),
            };
            return {
              ...a,
              session,
              timer: t.restAfter
                ? { phase: "rest", endsAt: Date.now() + t.restAfter * 1000, total: t.restAfter, label: t.label }
                : null,
            };
          });
          setNow(Date.now());
        };

        // Tasto "Fine" durante l'esercizio: registra i secondi davvero fatti,
        // non quelli programmati. Serve su stretching e tenute.
        const finishTimedNow = () => {
          if (!timer || timer.phase !== "work") return;
          const doneSecs = Math.max(1, Math.round(timer.total - Math.max(0, remaining) / 1000));
          endTone();
          closeTimedSet(doneSecs);
        };
        const adjustRest = (delta) =>
          setActive((a) =>
            a && a.timer
              ? {
                  ...a,
                  timer: {
                    ...a.timer,
                    endsAt: Math.max(Date.now(), a.timer.endsAt + delta * 1000),
                    total: Math.max(5, a.timer.total + delta),
                  },
                }
              : a
          );
        const stopRest = () => setActive((a) => (a ? { ...a, timer: null } : a));

        const finishSession = () => {
          if (!active) return;
          const s = active.session;
          const kept = { ...s, endedAt: todayISO(), entries: s.entries.filter((e) => e.sets.length > 0) };
          if (kept.entries.length) {
            setData((d) => ({ ...d, sessions: [...d.sessions, kept] }));
            // Un allenamento annullato o vuoto non deve far avanzare il ciclo.
            if (kept.programId && kept.programDay != null) moveCursor(kept.programId, kept.programDay);
          }
          setActive(null);
          setTab(kept.entries.length ? "storico" : "allena");
        };
        const discardSession = () => setActive(null);

        // Il ripristino non passa dal salvataggio ritardato: scrive subito e riporta
        // l'esito, perché è l'unica operazione in cui l'utente ha il diritto di
        // sapere con certezza se è andata a buon fine. Mette anche da parte
        // l'archivio precedente, così un ripensamento resta possibile.
        const restoreArchive = async (nuovo) => {
          await saveRollback(data);
          const res = await writeRecord(DATA_KEY, nuovo);
          if (!res.ok) {
            setPersistence((p) => ({ ...p, issue: res.reason }));
            return { ok: false };
          }
          setData(nuovo);
          setPersistence({ writable: true, issue: store.durable ? null : "volatile" });
          return { ok: true };
        };

        // Via d'uscita quando l'archivio è illeggibile e i salvataggi sono fermi:
        // senza questa, l'app resterebbe in sola lettura per sempre.
        const resetArchive = async () => {
          const vuoto = emptyData();
          const res = await writeRecord(DATA_KEY, vuoto);
          if (!res.ok) {
            setPersistence((p) => ({ ...p, issue: res.reason }));
            return { ok: false };
          }
          setData(vuoto);
          setPersistence({ writable: true, issue: store.durable ? null : "volatile" });
          return { ok: true };
        };

        const exName = useCallback(
          (id) => data.exercises.find((e) => e.id === id)?.name || "Esercizio",
          [data.exercises]
        );

        if (!loaded) {
          return (
            <div className="gimmo-shell" style={{ ...shell, minHeight: "100vh", alignItems: "center", justifyContent: "center", display: "flex" }}>
              <span style={{ color: C.muted }}>Carico i tuoi dati…</span>
            </div>
          );
        }

        return (
          <div className="gimmo-shell" style={shell}>
            <style>{`
              @import url('https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Inter:wght@400;500;600&display=swap');
              /* 100dvh segue la barra del browser mentre compare e scompare;
                 100vh resta per i browser che non la conoscono. L'ordine conta:
                 chi non capisce la seconda riga tiene la prima. */
              .gimmo-shell { height: 100vh; height: 100dvh; }
              .gimmo-scroll { overscroll-behavior: contain; }
              * { -webkit-tap-highlight-color: transparent; }
              button:focus-visible, input:focus-visible, textarea:focus-visible { outline: 2px solid ${C.yellow}; outline-offset: 2px; }
              input::placeholder, textarea::placeholder { color: ${C.muted}; opacity: .7; }
              @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
            `}</style>

            <div className="gimmo-scroll" style={{ flex: 1, overflowY: "auto", paddingBottom: timer ? 168 : 96 }}>
              <PersistenceNotice issue={persistence.issue} />
              {tab === "allena" && (
                <TrainView
                  data={data}
                  active={active}
                  exName={exName}
                  addExercise={addExercise}
                  startSession={startSession}
                  skipProgramDay={skipProgramDay}
                  updateSession={updateSession}
                  startRest={startRest}
                  startTimed={startTimed}
                  finishSession={finishSession}
                  discardSession={discardSession}
                />
              )}
              {tab === "schede" && (
                <PlanView
                  data={data}
                  exName={exName}
                  addExercise={addExercise}
                  renameExercise={renameExercise}
                  saveRoutine={saveRoutine}
                  deleteRoutine={deleteRoutine}
                  saveProgram={saveProgram}
                  deleteProgram={deleteProgram}
                  startSession={startSession}
                  hasActive={!!active}
                />
              )}
              {tab === "esercizi" && (
                <ExercisesView
                  data={data}
                  addExercise={addExercise}
                  renameExercise={renameExercise}
                  deleteExercise={deleteExercise}
                />
              )}
              {tab === "storico" && (
                <HistoryView
                  data={data}
                  exName={exName}
                  persistence={persistence}
                  sessionInCorso={!!active}
                  onRestore={restoreArchive}
                  onReset={resetArchive}
                />
              )}
            </div>

            {timer && (
              <TimerBar
                remaining={remaining}
                timer={timer}
                onAdjust={adjustRest}
                onStop={stopRest}
                onFinishNow={finishTimedNow}
              />
            )}

            <nav
              style={{
                display: "grid",
                gridTemplateColumns: "repeat(4, 1fr)",
                borderTop: `1px solid ${C.line}`,
                background: C.surface,
                // Su iPhone senza tasto fisico la barra di sistema copre il fondo
                // dello schermo: senza questo, "Storico" finisce sotto la lineetta.
                paddingBottom: "env(safe-area-inset-bottom, 0px)",
              }}
            >
              {[
                ["allena", "Allena"],
                ["schede", "Schede"],
                ["esercizi", "Esercizi"],
                ["storico", "Storico"],
              ].map(([key, label]) => (
                <button
                  key={key}
                  onClick={() => setTab(key)}
                  style={{
                    background: "transparent",
                    border: "none",
                    borderTop: `2px solid ${tab === key ? C.yellow : "transparent"}`,
                    color: tab === key ? C.text : C.muted,
                    padding: "14px 4px 18px",
                    fontSize: 13,
                    fontWeight: 600,
                    fontFamily: "inherit",
                    cursor: "pointer",
                  }}
                >
                  {label}
                  {key === "allena" && active ? (
                    <span style={{ color: C.green, marginLeft: 5, fontSize: 16, lineHeight: 0 }}>•</span>
                  ) : null}
                </button>
              ))}
            </nav>
          </div>
        );
      }

      const shell = {
        fontFamily: "'Inter', system-ui, -apple-system, sans-serif",
        background: C.bg,
        color: C.text,
        // L'altezza sta nella classe .gimmo-shell qui sotto e non qui: da uno stile
        // inline non si può scrivere una regola con ripiego, e su iPhone 100vh è
        // sbagliata (conta anche la barra del browser, così il fondo finisce
        // sotto lo schermo). Serve 100dvh con 100vh come riserva.
        display: "flex",
        flexDirection: "column",
        maxWidth: 520,
        margin: "0 auto",
        overflow: "hidden",
        // Lascia respirare la tacca e la barra laterale in orizzontale.
        paddingTop: "env(safe-area-inset-top, 0px)",
        paddingLeft: "env(safe-area-inset-left, 0px)",
        paddingRight: "env(safe-area-inset-right, 0px)",
        boxSizing: "border-box",
      };

      /* ---------------------------- barra timer ---------------------------- */

      function TimerBar({ remaining, timer, onAdjust, onStop, onFinishNow }) {
        const phase = timer.phase || "rest";
        const prep = phase === "prep";
        const work = phase === "work";
        const done = remaining <= 0;
        const restDone = !prep && !work && done;
        const pct = Math.max(0, Math.min(1, remaining / (timer.total * 1000)));
        const accent = prep ? C.yellow : work ? C.blue : done ? C.green : C.yellow;
        const secs = Math.max(0, Math.ceil(remaining / 1000));

        return (
          <div
            style={{
              borderTop: `1px solid ${restDone ? C.green : C.line}`,
              background: restDone ? "#16281D" : C.surface,
              padding: "12px 16px 14px",
            }}
          >
            <div style={{ height: 3, background: C.surface2, borderRadius: 2, marginBottom: 10, overflow: "hidden" }}>
              <div
                style={{
                  width: `${pct * 100}%`,
                  height: "100%",
                  background: accent,
                  transition: "width .25s linear",
                }}
              />
            </div>
            <div style={{ display: "flex", alignItems: "center", gap: 12 }}>
              <div style={{ flex: 1, minWidth: 0 }}>
                <div
                  style={{
                    fontFamily: "'Barlow Condensed', sans-serif",
                    fontSize: 44,
                    fontWeight: 700,
                    lineHeight: 0.95,
                    letterSpacing: "0.01em",
                    fontVariantNumeric: "tabular-nums",
                    color: prep ? C.yellow : restDone ? C.green : C.text,
                  }}
                >
                  {prep ? secs : restDone ? "Vai" : fmtClock(remaining)}
                </div>
                <div
                  style={{
                    fontSize: 12,
                    color: C.muted,
                    whiteSpace: "nowrap",
                    overflow: "hidden",
                    textOverflow: "ellipsis",
                  }}
                >
                  {prep
                    ? `Preparati · ${timer.label}`
                    : work
                    ? `In corso · ${timer.label}`
                    : restDone
                    ? "Recupero finito"
                    : `Recupero · ${timer.label}`}
                </div>
              </div>

              {work ? (
                <Btn size="sm" tone="go" onClick={onFinishNow}>
                  Fine
                </Btn>
              ) : prep ? (
                <Btn size="sm" onClick={onStop}>
                  Annulla
                </Btn>
              ) : (
                <>
                  <Btn size="sm" onClick={() => onAdjust(-15)} aria-label="meno 15 secondi">
                    −15s
                  </Btn>
                  <Btn size="sm" onClick={() => onAdjust(15)} aria-label="più 15 secondi">
                    +15s
                  </Btn>
                  <Btn size="sm" tone={done ? "go" : "ghost"} onClick={onStop}>
                    {done ? "Ok" : "Salta"}
                  </Btn>
                </>
              )}
            </div>
          </div>
        );
      }

      /* ------------------------------- Allena ------------------------------ */

      function TrainView(props) {
        const { data, active } = props;
        if (!active) return <StartPanel {...props} />;
        return <LiveSession {...props} />;
      }

      function StartPanel({ data, startSession, skipProgramDay }) {
        const [lastSessions] = useMemo(
          () => [[...data.sessions].sort((a, b) => new Date(b.startedAt) - new Date(a.startedAt)).slice(0, 3)],
          [data.sessions]
        );
        return (
          <div style={{ padding: "26px 18px" }}>
            <h1 style={h1}>Pronto ad allenarti</h1>
            <p style={{ color: C.muted, marginTop: 0, marginBottom: 24, fontSize: 15, lineHeight: 1.5 }}>
              Parti da una scheda salvata, oppure aggiungi gli esercizi mano a mano.
            </p>

            {data.programs.length > 0 && (
              <>
                <div style={{ fontSize: 13, color: C.muted, marginBottom: 10 }}>
                  {data.programs.length > 1 ? "I tuoi programmi" : "Il tuo programma"}
                </div>
                {data.programs.map((p) => {
                  const idx = p.days.length ? (p.cursor ?? 0) % p.days.length : 0;
                  const day = p.days[idx];
                  const routine = day && !day.rest ? data.routines.find((r) => r.id === day.routineId) : null;
                  return (
                    <div key={p.id} style={{ ...cardBox, marginBottom: 10 }}>
                      <div style={{ fontSize: 13, color: C.muted }}>{p.name}</div>
                      <div style={{ fontSize: 18, fontWeight: 600, margin: "4px 0 2px" }}>
                        {!day ? "Programma vuoto" : day.rest ? "Riposo" : routine ? routine.name : "Scheda eliminata"}
                      </div>
                      <div style={{ fontSize: 13, color: C.muted, marginBottom: 12 }}>
                        Giorno {idx + 1} di {p.days.length}
                      </div>
                      <div style={{ display: "flex", gap: 8, flexWrap: "wrap" }}>
                        {routine && (
                          <Btn tone="primary" size="sm" onClick={() => startSession(routine, p, idx)}>
                            Inizia
                          </Btn>
                        )}
                        {day && (
                          <Btn size="sm" onClick={() => skipProgramDay(p)}>
                            {day.rest ? "Segna riposo fatto" : "Salta giorno"}
                          </Btn>
                        )}
                      </div>
                    </div>
                  );
                })}
                <div style={{ height: 22 }} />
              </>
            )}

            <Btn
              tone={data.programs.length ? "ghost" : "primary"}
              size="lg"
              style={{ width: "100%", marginBottom: 22 }}
              onClick={() => startSession(null)}
            >
              Allenamento libero
            </Btn>

            <div style={{ fontSize: 13, color: C.muted, marginBottom: 10 }}>Le tue schede</div>
            {data.routines.length === 0 ? (
              <div style={emptyBox}>Nessuna scheda ancora. Creane una dalla sezione Schede.</div>
            ) : (
              data.routines.map((r) => (
                <button key={r.id} onClick={() => startSession(r)} style={rowCard}>
                  <div>
                    <div style={{ fontSize: 16, fontWeight: 600 }}>{r.name}</div>
                    <div style={{ fontSize: 13, color: C.muted, marginTop: 3 }}>
                      {r.items.length} eserciz{r.items.length === 1 ? "io" : "i"}
                    </div>
                  </div>
                  <span style={{ color: C.blue, fontSize: 14, fontWeight: 600 }}>Inizia</span>
                </button>
              ))
            )}

            {lastSessions.length > 0 && (
              <>
                <div style={{ fontSize: 13, color: C.muted, margin: "26px 0 10px" }}>Ultimi allenamenti</div>
                {lastSessions.map((s) => (
                  <div key={s.id} style={{ ...rowCard, cursor: "default" }}>
                    <div>
                      <div style={{ fontSize: 15, fontWeight: 500 }}>{s.name}</div>
                      <div style={{ fontSize: 13, color: C.muted, marginTop: 3 }}>{fmtDate(s.startedAt)}</div>
                    </div>
                    <span style={{ fontSize: 13, color: C.muted }}>
                      {s.entries.reduce((n, e) => n + e.sets.length, 0)} serie
                    </span>
                  </div>
                ))}
              </>
            )}
          </div>
        );
      }

      function LiveSession({
        data,
        active,
        exName,
        addExercise,
        updateSession,
        startRest,
        startTimed,
        finishSession,
        discardSession,
      }) {
        const s = active.session;
        const [openId, setOpenId] = useState(s.entries[0]?.id || null);
        const [adding, setAdding] = useState(false);
        const [confirmEnd, setConfirmEnd] = useState(false);

        const elapsed = Date.now() - new Date(s.startedAt).getTime();

        const addEntry = (exerciseId, rest = REST_DEFAULT) => {
          const entry = {
            id: uid(),
            exerciseId,
            mode: "reps",
            targetSets: null,
            targetReps: null,
            targetDuration: null,
            rest,
            sets: [],
          };
          updateSession((ses) => ({ ...ses, entries: [...ses.entries, entry] }));
          setOpenId(entry.id);
          setAdding(false);
        };

        const patchEntry = (id, patch) =>
          updateSession((ses) => ({
            ...ses,
            entries: ses.entries.map((e) => (e.id === id ? { ...e, ...patch } : e)),
          }));

        const totalSets = s.entries.reduce((n, e) => n + e.sets.length, 0);

        return (
          <div style={{ padding: "20px 16px 8px" }}>
            <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start", marginBottom: 18 }}>
              <div style={{ minWidth: 0 }}>
                <h1 style={{ ...h1, marginBottom: 4 }}>{s.name}</h1>
                <div style={{ color: C.muted, fontSize: 13 }}>
                  {fmtClock(elapsed)} · {totalSets} serie
                </div>
              </div>
              <Btn size="sm" onClick={() => setConfirmEnd(true)}>
                Termina
              </Btn>
            </div>

            {s.entries.length === 0 && (
              <div style={emptyBox}>Aggiungi il primo esercizio per iniziare a registrare le serie.</div>
            )}

            {s.entries.map((entry, i) => (
              <EntryCard
                key={entry.id}
                index={i + 1}
                entry={entry}
                name={exName(entry.exerciseId)}
                open={openId === entry.id}
                onToggle={() => setOpenId(openId === entry.id ? null : entry.id)}
                onPatch={(p) => patchEntry(entry.id, p)}
                startRest={startRest}
                startTimed={startTimed}
                history={lastPerformance(data.sessions, entry.exerciseId)}
              />
            ))}

            <Btn size="lg" style={{ width: "100%", marginTop: 14 }} onClick={() => setAdding(true)}>
              + Aggiungi esercizio
            </Btn>

            <AddExerciseSheet
              open={adding}
              onClose={() => setAdding(false)}
              exercises={data.exercises}
              sessions={data.sessions}
              onPick={(id) => addEntry(id)}
              onCreate={(name) => {
                const id = addExercise(name);
                if (id) addEntry(id);
              }}
            />

            <Sheet open={confirmEnd} onClose={() => setConfirmEnd(false)} title="Terminare l'allenamento?">
              <p style={{ color: C.muted, fontSize: 15, lineHeight: 1.5, marginTop: 0 }}>
                Le serie registrate finiscono nello storico. Gli esercizi senza serie non vengono salvati.
              </p>
              <Btn tone="primary" size="lg" style={{ width: "100%", marginBottom: 10 }} onClick={finishSession}>
                Salva e termina
              </Btn>
              <Btn tone="danger" size="md" style={{ width: "100%" }} onClick={discardSession}>
                Annulla l'allenamento senza salvare
              </Btn>
            </Sheet>
          </div>
        );
      }

      function EntryCard({ index, entry, name, open, onToggle, onPatch, startRest, startTimed, history }) {
        const lastSet = entry.sets[entry.sets.length - 1];
        const historyLast = history?.sets?.[history.sets.length - 1];
        const seed = lastSet || historyLast || {};
        // targetReps può valere "max": per il contatore serve comunque un numero.
        const targetReps = typeof entry.targetReps === "number" ? entry.targetReps : null;
        const [w, setW] = useState(seed.w ?? 0);
        const [r, setR] = useState(seed.r ?? targetReps ?? 10);
        const [amrap, setAmrap] = useState(seed.max === true || entry.targetReps === "max");
        const [editRest, setEditRest] = useState(false);

        useEffect(() => {
          if (lastSet) {
            setW(lastSet.w ?? 0);
            setR(lastSet.r ?? r);
            if (lastSet.max != null) setAmrap(!!lastSet.max);
          }
        }, [entry.sets.length]);

        const timed = entry.mode === "time";
        const duration = entry.targetDuration ?? 30;

        const logSet = (weight, reps) => {
          const set = { w: weight > 0 ? weight : null, r: reps > 0 ? reps : null, at: todayISO() };
          if (amrap) set.max = true;
          onPatch({ sets: [...entry.sets, set] });
          if (entry.rest) startRest(entry.rest, name);
        };

        const target =
          entry.mode === "time"
            ? entry.targetDuration
              ? `${entry.targetDuration}s`
              : null
            : entry.targetSets
            ? `${entry.targetSets}×${entry.targetReps ?? "—"}`
            : null;

        const doneCount = entry.sets.length;
        const complete = entry.targetSets && doneCount >= entry.targetSets;

        return (
          <div
            style={{
              background: C.surface,
              border: `1px solid ${open ? C.line : "#262E37"}`,
              borderRadius: 14,
              marginBottom: 10,
              overflow: "hidden",
            }}
          >
            <button
              onClick={onToggle}
              style={{
                display: "flex",
                width: "100%",
                alignItems: "center",
                gap: 12,
                background: "transparent",
                border: "none",
                color: C.text,
                padding: "14px 14px",
                cursor: "pointer",
                textAlign: "left",
                fontFamily: "inherit",
              }}
            >
              <span
                style={{
                  fontFamily: "'Barlow Condensed', sans-serif",
                  fontSize: 26,
                  fontWeight: 600,
                  color: complete ? C.green : C.muted,
                  width: 22,
                  flexShrink: 0,
                  fontVariantNumeric: "tabular-nums",
                }}
              >
                {index}
              </span>
              <span style={{ flex: 1, minWidth: 0 }}>
                <span style={{ display: "block", fontSize: 16, fontWeight: 600 }}>{name}</span>
                <span style={{ display: "block", fontSize: 13, color: C.muted, marginTop: 2 }}>
                  {target ? `${target} · ` : ""}rec {fmtRest(entry.rest)}
                  {doneCount ? ` · ${doneCount} fatte` : ""}
                </span>
              </span>
              <span style={{ color: C.muted, fontSize: 13 }}>{open ? "▾" : "▸"}</span>
            </button>

            {entry.sets.length > 0 && (
              <div style={{ display: "flex", flexWrap: "wrap", gap: 6, padding: "0 14px 12px" }}>
                {entry.sets.map((set, i) => (
                  <span key={i} style={chip}>
                    <span style={{ color: C.muted, marginRight: 4 }}>{i + 1}</span>
                    {fmtSet(set)}
                  </span>
                ))}
              </div>
            )}

            {open && (
              <div style={{ padding: "4px 14px 16px", borderTop: `1px solid ${C.surface2}` }}>
                {history && (
                  <div style={{ fontSize: 13, color: C.muted, margin: "12px 0 14px" }}>
                    Ultima volta ({fmtDateShort(history.date)}):{" "}
                    {history.sets.map((s) => fmtSet(s, true)).join(" · ")}
                  </div>
                )}

                <div style={{ display: "flex", gap: 8, marginBottom: 14 }}>
                  {[
                    ["reps", "Serie × rip"],
                    ["time", "A tempo"],
                  ].map(([m, label]) => (
                    <Btn
                      key={m}
                      size="sm"
                      tone={(entry.mode || "reps") === m ? "primary" : "ghost"}
                      onClick={() =>
                        onPatch({
                          mode: m,
                          targetDuration: m === "time" ? entry.targetDuration ?? 30 : entry.targetDuration,
                        })
                      }
                    >
                      {label}
                    </Btn>
                  ))}
                </div>

                {timed ? (
                  <>
                    <div style={{ marginBottom: 14 }}>
                      <div style={{ fontSize: 12, color: C.muted, marginBottom: 4 }}>Durata</div>
                      <Stepper
                        value={duration}
                        onChange={(v) => onPatch({ targetDuration: v })}
                        step={5}
                        min={5}
                        suffix="s"
                        width={72}
                      />
                    </div>

                    <Btn
