                      tone="go"
                      size="lg"
                      style={{ width: "100%", marginBottom: 10 }}
                      onClick={() => startTimed(entry, name)}
                    >
                      Avvia · {duration}s
                    </Btn>

                    <div style={{ fontSize: 12, color: C.muted, marginBottom: 12, lineHeight: 1.5 }}>
                      {PREP_SECONDS} secondi di preparazione con un bip al secondo, poi parte l'esercizio. Gli ultimi
                      3 secondi suonano di nuovo, la serie si registra da sola e il recupero parte subito dopo.
                    </div>
                  </>
                ) : (
                  <>
                    <div style={{ display: "flex", gap: 18, alignItems: "center", marginBottom: 10, flexWrap: "wrap" }}>
                      <div>
                        <div style={{ fontSize: 12, color: C.muted, marginBottom: 4 }}>Carico (kg)</div>
                        <Stepper value={w} onChange={setW} step={2.5} decimals={1} suffix="kg" editable />
                      </div>
                      <div>
                        <div style={{ fontSize: 12, color: C.muted, marginBottom: 4 }}>Ripetizioni</div>
                        <Stepper value={r} onChange={setR} step={1} width={62} />
                      </div>
                      <div>
                        <div style={{ fontSize: 12, color: C.muted, marginBottom: 4 }}>A cedimento</div>
                        <Btn
                          size="md"
                          tone={amrap ? "primary" : "ghost"}
                          onClick={() => setAmrap(!amrap)}
                          style={{ height: 44, minWidth: 64 }}
                        >
                          max
                        </Btn>
                      </div>
                    </div>

                    {amrap && (
                      <div style={{ fontSize: 12, color: C.muted, marginBottom: 12 }}>
                        Lascia le ripetizioni a 0 se non le hai contate.
                      </div>
                    )}

                    <Btn tone="go" size="lg" style={{ width: "100%", marginBottom: 10 }} onClick={() => logSet(w, r)}>
                      Serie fatta · {fmtSet({ w: w > 0 ? w : null, r: r > 0 ? r : null, max: amrap })}
                    </Btn>
                  </>
                )}

                <div style={{ display: "flex", gap: 8, flexWrap: "wrap" }}>
                  <Btn
                    size="sm"
                    disabled={!entry.sets.length}
                    onClick={() => onPatch({ sets: entry.sets.slice(0, -1) })}
                  >
                    Annulla ultima serie
                  </Btn>
                  <Btn size="sm" onClick={() => setEditRest(true)}>
                    Recupero {fmtRest(entry.rest)}
                  </Btn>
                  {entry.rest ? (
                    <Btn size="sm" onClick={() => startRest(entry.rest, name)}>
                      Avvia recupero
                    </Btn>
                  ) : null}
                </div>
              </div>
            )}

            <Sheet open={editRest} onClose={() => setEditRest(false)} title={`Recupero · ${name}`}>
              <div style={{ display: "flex", gap: 8, flexWrap: "wrap", marginBottom: 18 }}>
                {[45, 60, 90, 120, 180, 240].map((v) => (
                  <Btn
                    key={v}
                    size="md"
                    tone={entry.rest === v ? "primary" : "ghost"}
                    onClick={() => {
                      onPatch({ rest: v });
                      setEditRest(false);
                    }}
                  >
                    {fmtRest(v)}
                  </Btn>
                ))}
              </div>
              <Field label="Valore personalizzato (secondi)">
                <Input
                  type="number"
                  inputMode="numeric"
                  defaultValue={entry.rest ?? REST_DEFAULT}
                  onChange={(e) => onPatch({ rest: Math.max(0, parseInt(e.target.value || "0", 10)) })}
                />
              </Field>
              <Btn tone="primary" size="lg" style={{ width: "100%" }} onClick={() => setEditRest(false)}>
                Fatto
              </Btn>
            </Sheet>
          </div>
        );
      }

      function AddExerciseSheet({ open, onClose, exercises, sessions, onPick, onCreate }) {
        const [q, setQ] = useState("");
        const filtered = exercises.filter((e) => e.name.toLowerCase().includes(q.trim().toLowerCase()));
        const exact = exercises.some((e) => e.name.toLowerCase() === q.trim().toLowerCase());

        const recent = useMemo(() => {
          const seen = [];
          const ordered = [...sessions].sort((a, b) => new Date(b.startedAt) - new Date(a.startedAt));
          for (const s of ordered) for (const e of s.entries) if (!seen.includes(e.exerciseId)) seen.push(e.exerciseId);
          return seen.slice(0, 6);
        }, [sessions]);

        return (
          <Sheet
            open={open}
            onClose={onClose}
            anchor="top"
            title="Aggiungi esercizio"
            sticky={
              <>
                <Input
                  autoFocus
                  placeholder="Cerca o scrivi un nome nuovo"
                  value={q}
                  onChange={(e) => setQ(e.target.value)}
                />
                {q.trim() && !exact && (
                  <Btn
                    tone="primary"
                    size="md"
                    style={{ width: "100%", marginTop: 10 }}
                    onClick={() => {
                      onCreate(q);
                      setQ("");
                    }}
                  >
                    Crea “{q.trim()}”
                  </Btn>
                )}
              </>
            }
          >
            {!q && recent.length > 0 && (
              <>
                <div style={{ fontSize: 13, color: C.muted, marginBottom: 8 }}>Recenti</div>
                <div style={{ display: "flex", flexWrap: "wrap", gap: 8, marginBottom: 18 }}>
                  {recent.map((id) => {
                    const ex = exercises.find((e) => e.id === id);
                    if (!ex) return null;
                    return (
                      <Btn key={id} size="sm" onClick={() => onPick(id)}>
                        {ex.name}
                      </Btn>
                    );
                  })}
                </div>
              </>
            )}
            {filtered.length === 0 ? (
              <div style={{ ...emptyBox, marginTop: 4 }}>
                {q
                  ? "Nessun esercizio con questo nome. Crealo con il tasto qui sopra."
                  : "La libreria è vuota. Scrivi un nome qui sopra per creare il primo esercizio."}
              </div>
            ) : (
              filtered.map((ex) => (
                <button key={ex.id} onClick={() => onPick(ex.id)} style={{ ...rowCard, marginBottom: 8 }}>
                  <span style={{ fontSize: 15, fontWeight: 500 }}>{ex.name}</span>
                  <span style={{ color: C.blue, fontSize: 13, fontWeight: 600 }}>Aggiungi</span>
                </button>
              ))
            )}
          </Sheet>
        );
      }

      /* ------------------------------- Schede ------------------------------ */

      // Un solo posto per costruire le cose che si ripetono: le schede (esercizi
      // in ordine) e i programmi (schede in ordine). Gli editor occupano tutta la
      // pagina, quindi l'interruttore in alto compare solo quando non stai
      // modificando nulla.
      function PlanView({
        data,
        exName,
        addExercise,
        renameExercise,
        saveRoutine,
        deleteRoutine,
        saveProgram,
        deleteProgram,
        startSession,
        hasActive,
      }) {
        const [sub, setSub] = useState("schede");
        const [editingRoutine, setEditingRoutine] = useState(null);
        const [editingProgram, setEditingProgram] = useState(null);

        if (editingRoutine)
          return (
            <RoutineEditor
              routine={editingRoutine}
              data={data}
              exName={exName}
              addExercise={addExercise}
              renameExercise={renameExercise}
              onSave={(r) => {
                saveRoutine(r);
                setEditingRoutine(null);
              }}
              onCancel={() => setEditingRoutine(null)}
            />
          );

        if (editingProgram)
          return (
            <ProgramEditor
              program={editingProgram}
              data={data}
              onSave={(p) => {
                saveProgram(p);
                setEditingProgram(null);
              }}
              onCancel={() => setEditingProgram(null)}
            />
          );

        return (
          <div style={{ padding: "26px 18px" }}>
            <div style={{ display: "flex", gap: 8, marginBottom: 22 }}>
              <Btn size="sm" tone={sub === "schede" ? "primary" : "ghost"} onClick={() => setSub("schede")}>
                Schede
              </Btn>
              <Btn size="sm" tone={sub === "programmi" ? "primary" : "ghost"} onClick={() => setSub("programmi")}>
                Programmi
              </Btn>
            </div>

            {sub === "schede" ? (
              <RoutinesList
                data={data}
                exName={exName}
                deleteRoutine={deleteRoutine}
                startSession={startSession}
                hasActive={hasActive}
                onNew={() => setEditingRoutine({ id: uid(), name: "", items: [] })}
                onEdit={(r) => setEditingRoutine(JSON.parse(JSON.stringify(r)))}
              />
            ) : (
              <ProgramsList
                data={data}
                deleteProgram={deleteProgram}
                onNew={() => setEditingProgram({ id: uid(), name: "", days: [], cursor: 0 })}
                onEdit={(p) => setEditingProgram(JSON.parse(JSON.stringify(p)))}
              />
            )}
          </div>
        );
      }

      function RoutinesList({ data, exName, deleteRoutine, startSession, hasActive, onNew, onEdit }) {
        return (
          <>
            <h1 style={h1}>Schede</h1>
            <p style={{ color: C.muted, marginTop: 0, marginBottom: 22, fontSize: 15, lineHeight: 1.5 }}>
              Una sequenza di esercizi che ripeti nel tempo: ordine, serie e recuperi fissi.
            </p>

            <Btn tone="primary" size="lg" style={{ width: "100%", marginBottom: 22 }} onClick={onNew}>
              Nuova scheda
            </Btn>

            {data.routines.length === 0 ? (
              <div style={emptyBox}>Nessuna scheda salvata.</div>
            ) : (
              data.routines.map((r) => (
                <div key={r.id} style={{ ...cardBox, marginBottom: 12 }}>
                  <div style={{ fontSize: 17, fontWeight: 600, marginBottom: 4 }}>{r.name || "Senza nome"}</div>
                  <div style={{ fontSize: 13, color: C.muted, marginBottom: 12 }}>
                    {r.items.map((it, i) => `${i + 1}. ${exName(it.exerciseId)}`).join("  ")}
                  </div>
                  <div style={{ display: "flex", gap: 8, flexWrap: "wrap" }}>
                    <Btn size="sm" tone="primary" disabled={hasActive} onClick={() => startSession(r)}>
                      Inizia
                    </Btn>
                    <Btn size="sm" onClick={() => onEdit(r)}>
                      Modifica
                    </Btn>
                    <Btn size="sm" tone="danger" onClick={() => deleteRoutine(r.id)}>
                      Elimina
                    </Btn>
                  </div>
                </div>
              ))
            )}
          </>
        );
      }

      /* ------------------------------ Programmi ---------------------------- */

      function ProgramsList({ data, deleteProgram, onNew, onEdit }) {
        const rName = (id) => data.routines.find((r) => r.id === id)?.name || "scheda eliminata";
        return (
          <>
            <h1 style={h1}>Programmi</h1>
            <p style={{ color: C.muted, marginTop: 0, marginBottom: 22, fontSize: 15, lineHeight: 1.5 }}>
              Un ciclo di schede che si alternano: push, pull, gambe, riposo. Gimmo tiene il segno e nella schermata
              Allena ti propone sempre il giorno giusto. Finito il ciclo, riparte da capo.
            </p>

            {data.routines.length === 0 && (
              <div style={emptyBox}>Prima servono le schede: un programma non è altro che il loro ordine.</div>
            )}

            <Btn
              tone="primary"
              size="lg"
              style={{ width: "100%", marginBottom: 22 }}
              disabled={data.routines.length === 0}
              onClick={onNew}
            >
              Nuovo programma
            </Btn>

            {data.programs.length === 0 ? (
              <div style={emptyBox}>Nessun programma salvato.</div>
            ) : (
              data.programs.map((p) => {
                const next = p.days.length ? (p.cursor ?? 0) % p.days.length : 0;
                return (
                  <div key={p.id} style={{ ...cardBox, marginBottom: 12 }}>
                    <div style={{ fontSize: 17, fontWeight: 600, marginBottom: 8 }}>{p.name || "Senza nome"}</div>
                    {/* In verticale e numerato: in orizzontale i giorni si
                        leggevano come un elenco di schede, non come un ciclo. */}
                    <div style={{ marginBottom: 12 }}>
                      {p.days.map((d, i) => {
                        const prossimo = i === next;
                        return (
                          <div
                            key={d.id}
                            style={{
                              display: "flex",
                              alignItems: "baseline",
                              gap: 10,
                              padding: "5px 0",
                              borderTop: i ? `1px solid ${C.surface2}` : "none",
                            }}
                          >
                            <span
                              style={{
                                fontFamily: "'Barlow Condensed', sans-serif",
                                fontSize: 20,
                                fontWeight: 600,
                                width: 20,
                                flexShrink: 0,
                                textAlign: "right",
                                color: prossimo ? C.yellow : C.muted,
                                fontVariantNumeric: "tabular-nums",
                              }}
                            >
                              {i + 1}
                            </span>
                            <span
                              style={{
                                flex: 1,
                                minWidth: 0,
                                fontSize: 15,
                                fontWeight: prossimo ? 600 : 500,
                                color: prossimo ? C.yellow : d.rest ? C.muted : C.text,
                              }}
                            >
                              {d.rest ? "Riposo" : rName(d.routineId)}
                            </span>
                            {prossimo && (
                              <span style={{ fontSize: 11, color: C.yellow, flexShrink: 0 }}>prossimo</span>
                            )}
                          </div>
                        );
                      })}
                    </div>
                    <div style={{ display: "flex", gap: 8, flexWrap: "wrap" }}>
                      <Btn size="sm" onClick={() => onEdit(p)}>
                        Modifica
                      </Btn>
                      <Btn size="sm" tone="danger" onClick={() => deleteProgram(p.id)}>
                        Elimina
                      </Btn>
                    </div>
                  </div>
                );
              })
            )}
          </>
        );
      }

      function ProgramEditor({ program, data, onSave, onCancel }) {
        const [name, setName] = useState(program.name);
        const [days, setDays] = useState(program.days);
        const [adding, setAdding] = useState(false);
        const rName = (id) => data.routines.find((r) => r.id === id)?.name || "Scheda eliminata";

        const addDay = (day) => {
          setDays((d) => [...d, { id: uid(), ...day }]);
          setAdding(false);
        };
        const remove = (id) => setDays((d) => d.filter((x) => x.id !== id));
        const move = (i, dir) =>
          setDays((d) => {
            const j = i + dir;
            if (j < 0 || j >= d.length) return d;
            const copy = [...d];
            [copy[i], copy[j]] = [copy[j], copy[i]];
            return copy;
          });

        return (
          <div style={{ padding: "22px 18px" }}>
            <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 18 }}>
              <h1 style={{ ...h1, marginBottom: 0 }}>{program.name ? "Modifica programma" : "Nuovo programma"}</h1>
              <Btn size="sm" tone="quiet" onClick={onCancel}>
                Annulla
              </Btn>
            </div>

            <Field label="Nome del programma">
              <Input value={name} onChange={(e) => setName(e.target.value)} placeholder="Es. Push / Pull / Gambe" />
            </Field>

            <div style={{ fontSize: 13, color: C.muted, margin: "18px 0 10px" }}>Giorni del ciclo</div>

            {days.length === 0 && (
              <div style={emptyBox}>
                Aggiungi il primo giorno. Metti anche i riposi, se vuoi che il ciclo li conti.
              </div>
            )}

            {days.map((d, i) => (
              <div key={d.id} style={{ ...cardBox, marginBottom: 10, display: "flex", alignItems: "center", gap: 10 }}>
                <span
                  style={{
                    fontFamily: "'Barlow Condensed', sans-serif",
                    fontSize: 24,
                    fontWeight: 600,
                    color: C.muted,
                    width: 20,
                    flexShrink: 0,
                    fontVariantNumeric: "tabular-nums",
                  }}
                >
                  {i + 1}
                </span>
                <span
                  style={{
                    flex: 1,
                    minWidth: 0,
                    fontSize: 16,
                    fontWeight: 600,
                    color: d.rest ? C.muted : C.text,
                    whiteSpace: "nowrap",
                    overflow: "hidden",
                    textOverflow: "ellipsis",
                  }}
                >
                  {d.rest ? "Riposo" : rName(d.routineId)}
                </span>
                <div style={{ display: "flex", gap: 6, flexShrink: 0 }}>
                  <button onClick={() => move(i, -1)} style={miniBtn} aria-label="sposta su">
                    ↑
                  </button>
                  <button onClick={() => move(i, 1)} style={miniBtn} aria-label="sposta giù">
                    ↓
                  </button>
                  <button onClick={() => remove(d.id)} style={{ ...miniBtn, color: C.red }} aria-label="rimuovi">
                    ×
                  </button>
                </div>
              </div>
            ))}

            <Btn size="lg" style={{ width: "100%", marginTop: 12 }} onClick={() => setAdding(true)}>
              + Aggiungi giorno
            </Btn>

            <Btn
              tone="primary"
              size="lg"
              style={{ width: "100%", marginTop: 20 }}
              disabled={!name.trim() || days.length === 0}
              onClick={() =>
                onSave({
                  ...program,
                  name: name.trim(),
                  days,
                  // Se il ciclo si accorcia, il segnaposto non deve restare fuori.
                  cursor: days.length ? Math.min(program.cursor ?? 0, days.length - 1) : 0,
                })
              }
            >
              Salva programma
            </Btn>

            <Sheet open={adding} onClose={() => setAdding(false)} title="Aggiungi giorno">
              <Btn size="lg" style={{ width: "100%", marginBottom: 18 }} onClick={() => addDay({ rest: true })}>
                Giorno di riposo
              </Btn>
              <div style={{ fontSize: 13, color: C.muted, marginBottom: 8 }}>Le tue schede</div>
              {data.routines.map((r) => (
                <button key={r.id} onClick={() => addDay({ routineId: r.id })} style={{ ...rowCard, marginBottom: 8 }}>
                  <span style={{ fontSize: 15, fontWeight: 500 }}>{r.name || "Senza nome"}</span>
                  <span style={{ color: C.blue, fontSize: 13, fontWeight: 600 }}>Aggiungi</span>
                </button>
              ))}
            </Sheet>
          </div>
        );
      }

      function RoutineEditor({ routine, data, exName, addExercise, renameExercise, onSave, onCancel }) {
        const [name, setName] = useState(routine.name);
        const [items, setItems] = useState(routine.items);
        const [adding, setAdding] = useState(false);
        const [renaming, setRenaming] = useState(null); // id dell'esercizio da rinominare

        const addItem = (exerciseId) => {
          setItems((it) => [
            ...it,
            { id: uid(), exerciseId, mode: "reps", sets: 3, reps: 10, duration: 60, rest: REST_DEFAULT },
          ]);
          setAdding(false);
        };
        const patch = (id, p) => setItems((it) => it.map((x) => (x.id === id ? { ...x, ...p } : x)));
        const remove = (id) => setItems((it) => it.filter((x) => x.id !== id));
        const move = (i, dir) =>
          setItems((it) => {
            const j = i + dir;
            if (j < 0 || j >= it.length) return it;
            const copy = [...it];
            [copy[i], copy[j]] = [copy[j], copy[i]];
            return copy;
          });

        return (
          <div style={{ padding: "22px 18px" }}>
            <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 18 }}>
              <h1 style={{ ...h1, marginBottom: 0 }}>{routine.name ? "Modifica scheda" : "Nuova scheda"}</h1>
              <Btn size="sm" tone="quiet" onClick={onCancel}>
                Annulla
              </Btn>
            </div>

            <Field label="Nome della scheda">
              <Input value={name} onChange={(e) => setName(e.target.value)} placeholder="Es. Full body A" />
            </Field>

            <div style={{ fontSize: 13, color: C.muted, margin: "18px 0 10px" }}>Esercizi</div>

            {items.length === 0 && <div style={emptyBox}>Aggiungi il primo esercizio della scheda.</div>}

            {items.map((it, i) => (
              <div key={it.id} style={{ ...cardBox, marginBottom: 10 }}>
                {/* Il nome sta su una riga tutta sua: con i tasti a fianco,
                    un nome lungo veniva tagliato e non si capiva quale
                    esercizio stessi per spostare o eliminare. */}
                <div style={{ display: "flex", alignItems: "baseline", gap: 10, marginBottom: 10 }}>
                  <span
                    style={{
                      fontFamily: "'Barlow Condensed', sans-serif",
                      fontSize: 24,
                      fontWeight: 600,
                      color: C.muted,
                      width: 20,
                      flexShrink: 0,
                      fontVariantNumeric: "tabular-nums",
                    }}
                  >
                    {i + 1}
                  </span>
                  <span style={{ flex: 1, minWidth: 0, fontSize: 16, fontWeight: 600, lineHeight: 1.3 }}>
                    {exName(it.exerciseId)}
                  </span>
                </div>

                <div style={{ display: "flex", gap: 6, marginBottom: 12 }}>
                  <button
                    onClick={() => setRenaming(it.exerciseId)}
                    style={miniBtn}
                    aria-label={`rinomina ${exName(it.exerciseId)}`}
                  >
                    ✎
                  </button>
                  <button onClick={() => move(i, -1)} style={miniBtn} aria-label="sposta su">
                    ↑
                  </button>
                  <button onClick={() => move(i, 1)} style={miniBtn} aria-label="sposta giù">
                    ↓
                  </button>
                  <button onClick={() => remove(it.id)} style={{ ...miniBtn, color: C.red }} aria-label="rimuovi">
                    ×
                  </button>
                </div>

                <div style={{ display: "flex", gap: 8, marginBottom: 12 }}>
                  {[
                    ["reps", "Serie × rip"],
                    ["time", "A tempo"],
                  ].map(([m, label]) => (
                    <Btn key={m} size="sm" tone={it.mode === m ? "primary" : "ghost"} onClick={() => patch(it.id, { mode: m })}>
                      {label}
                    </Btn>
                  ))}
                </div>

                <div style={{ display: "flex", gap: 10, flexWrap: "wrap" }}>
                  {it.mode === "reps" ? (
                    <>
                      <SmallNum label="Serie" value={it.sets} onChange={(v) => patch(it.id, { sets: v })} />
                      <RepsField value={it.reps} onChange={(v) => patch(it.id, { reps: v })} />
                    </>
                  ) : (
                    <SmallNum label="Durata (s)" value={it.duration} onChange={(v) => patch(it.id, { duration: v })} />
                  )}
                  <SmallNum label="Recupero (s)" value={it.rest} onChange={(v) => patch(it.id, { rest: v })} />
                </div>
              </div>
            ))}

            <Btn size="lg" style={{ width: "100%", marginTop: 12 }} onClick={() => setAdding(true)}>
              + Aggiungi esercizio
            </Btn>

            <Btn
              tone="primary"
              size="lg"
              style={{ width: "100%", marginTop: 20 }}
              disabled={!name.trim() || items.length === 0}
              onClick={() => onSave({ ...routine, name: name.trim(), items })}
            >
              Salva scheda
            </Btn>

            <AddExerciseSheet
              open={adding}
              onClose={() => setAdding(false)}
              exercises={data.exercises}
              sessions={data.sessions}
              onPick={addItem}
              onCreate={(n) => {
                const id = addExercise(n);
                if (id) addItem(id);
              }}
            />

            {renaming && (
              <RenameExerciseSheet
                key={renaming}
                name={exName(renaming)}
                onClose={() => setRenaming(null)}
                onSave={(n) => {
                  renameExercise(renaming, n);
                  setRenaming(null);
                }}
              />
            )}
          </div>
        );
      }

      // `key={renaming}` nel punto in cui viene usato forza il rimontaggio a ogni
      // apertura: così il campo parte sempre dal nome giusto, senza sincronizzare
      // nulla a mano.
      function RenameExerciseSheet({ name, onClose, onSave }) {
        const [value, setValue] = useState(name);
        const clean = value.trim();
        return (
          <Sheet open anchor="top" onClose={onClose} title="Rinomina esercizio">
            <p style={{ color: C.muted, fontSize: 14, lineHeight: 1.5, marginTop: 0 }}>
              Il nome cambia ovunque: in archivio, nelle altre schede e nello storico. Le serie già registrate restano
              attaccate a questo esercizio.
            </p>
            <Field label="Nome">
              <Input
                autoFocus
                value={value}
                onChange={(e) => setValue(e.target.value)}
                onKeyDown={(e) => e.key === "Enter" && clean && onSave(clean)}
              />
            </Field>
            <Btn tone="primary" size="lg" style={{ width: "100%" }} disabled={!clean} onClick={() => onSave(clean)}>
              Salva nome
            </Btn>
          </Sheet>
        );
      }

      const numInput = {
        width: 92,
        background: C.bg,
        border: `1px solid ${C.line}`,
        color: C.text,
        borderRadius: 9,
        padding: "9px 10px",
        fontSize: 16,
        fontFamily: "inherit",
        outline: "none",
        boxSizing: "border-box",
      };

      function SmallNum({ label, value, onChange }) {
        return (
          <label style={{ display: "block" }}>
            <div style={{ fontSize: 12, color: C.muted, marginBottom: 5 }}>{label}</div>
            <input
              type="number"
              inputMode="numeric"
              value={value ?? ""}
              onChange={(e) => onChange(e.target.value === "" ? null : Math.max(0, parseInt(e.target.value, 10)))}
              style={numInput}
            />
          </label>
        );
      }

      // Le ripetizioni di una scheda possono essere un numero oppure "max"
      // (serie a cedimento). Il valore "max" viaggia poi fino all'allenamento.
      function RepsField({ value, onChange }) {
        const isMax = value === "max";
        return (
          <label style={{ display: "block" }}>
            <div style={{ fontSize: 12, color: C.muted, marginBottom: 5 }}>Ripetizioni</div>
            <div style={{ display: "flex", gap: 6, alignItems: "stretch" }}>
              <input
                type="number"
                inputMode="numeric"
                disabled={isMax}
                placeholder={isMax ? "max" : ""}
                value={isMax || value == null ? "" : value}
                onChange={(e) => onChange(e.target.value === "" ? null : Math.max(0, parseInt(e.target.value, 10)))}
                style={{ ...numInput, width: 56, opacity: isMax ? 0.45 : 1 }}
              />
              <Btn size="sm" tone={isMax ? "primary" : "ghost"} onClick={() => onChange(isMax ? 10 : "max")}>
                max
              </Btn>
            </div>
          </label>
        );
      }

      /* ------------------------------ Esercizi ----------------------------- */

      function ExercisesView({ data, addExercise, renameExercise, deleteExercise }) {
        const [name, setName] = useState("");
        const [detail, setDetail] = useState(null);

        const submit = () => {
          if (!name.trim()) return;
          addExercise(name);
          setName("");
        };

        if (detail) {
          const ex = data.exercises.find((e) => e.id === detail);
          if (ex)
            return (
              <ExerciseDetail
                ex={ex}
                sessions={data.sessions}
                onBack={() => setDetail(null)}
                onRename={renameExercise}
                onDelete={(id) => {
                  deleteExercise(id);
                  setDetail(null);
                }}
              />
            );
        }

        const sorted = [...data.exercises].sort((a, b) => a.name.localeCompare(b.name, "it"));

        return (
          <div style={{ padding: "26px 18px" }}>
            <h1 style={h1}>Esercizi</h1>
            <p style={{ color: C.muted, marginTop: 0, marginBottom: 20, fontSize: 15, lineHeight: 1.5 }}>
              In archivio serve solo il nome. Carichi, ripetizioni e recuperi si decidono nella scheda o durante
              l'allenamento.
            </p>

            <div style={{ display: "flex", gap: 8, marginBottom: 24 }}>
              <Input
                value={name}
                placeholder="Nome dell'esercizio"
                onChange={(e) => setName(e.target.value)}
                onKeyDown={(e) => e.key === "Enter" && submit()}
              />
              <Btn tone="primary" size="md" onClick={submit} disabled={!name.trim()} style={{ flexShrink: 0 }}>
                Aggiungi
              </Btn>
            </div>

            {sorted.length === 0 ? (
              <div style={emptyBox}>Nessun esercizio in archivio.</div>
            ) : (
              sorted.map((ex) => {
                const st = exerciseStats(data.sessions, ex.id);
                return (
                  <button key={ex.id} onClick={() => setDetail(ex.id)} style={{ ...rowCard, marginBottom: 8 }}>
                    <span>
                      <span style={{ display: "block", fontSize: 16, fontWeight: 500 }}>{ex.name}</span>
                      <span style={{ display: "block", fontSize: 13, color: C.muted, marginTop: 3 }}>
                        {!st.sessions
                          ? "mai allenato"
                          : st.best != null
                          ? `${st.sessions} allenamenti · massimo ${st.best}kg`
                          : st.totalTime
                          ? `${st.sessions} allenamenti · ${fmtClock(st.totalTime * 1000)} totali`
                          : `${st.sessions} allenamenti`}
                      </span>
                    </span>
                    <span style={{ color: C.muted }}>›</span>
                  </button>
                );
              })
            )}
          </div>
        );
      }

      function ExerciseDetail({ ex, sessions, onBack, onRename, onDelete }) {
        const st = useMemo(() => exerciseStats(sessions, ex.id), [sessions, ex.id]);
        const [name, setName] = useState(ex.name);
        const totalVolume = st.points.reduce((n, p) => n + p.vol, 0);

        return (
          <div style={{ padding: "22px 18px" }}>
            <Btn size="sm" tone="quiet" onClick={onBack} style={{ marginBottom: 14, paddingLeft: 0 }}>
              ‹ Esercizi
            </Btn>

            <Field label="Nome">
              <Input
                value={name}
                onChange={(e) => setName(e.target.value)}
                onBlur={() => name.trim() && onRename(ex.id, name.trim())}
              />
            </Field>

            <div style={{ display: "flex", gap: 10, marginTop: 22, marginBottom: 20 }}>
              <Stat label="Allenamenti" value={st.sessions} />
              <Stat label="Serie totali" value={st.totalSets} />
              {st.best == null && st.totalTime > 0 ? (
                <Stat label="Tempo totale" value={fmtClock(st.totalTime * 1000)} />
              ) : (
                <Stat label="Massimo" value={st.best != null ? `${st.best}kg` : "—"} />
              )}
            </div>

            {st.points.length >= 2 ? (
              <div style={{ ...cardBox, marginBottom: 14 }}>
                <div style={{ fontSize: 13, color: C.muted, marginBottom: 10 }}>Carico massimo per allenamento</div>
                <Sparkline points={st.points} valueKey="top" />
                <div style={{ display: "flex", justifyContent: "space-between", fontSize: 12, color: C.muted, marginTop: 6 }}>
                  <span>{fmtDateShort(st.points[0].date)}</span>
                  <span>{fmtDateShort(st.points[st.points.length - 1].date)}</span>
                </div>
              </div>
            ) : (
              <div style={emptyBox}>Servono almeno due allenamenti per vedere l'andamento.</div>
            )}

            {totalVolume > 0 && (
              <div style={{ ...cardBox, marginBottom: 14 }}>
                <div style={{ fontSize: 13, color: C.muted, marginBottom: 10 }}>Volume per allenamento (kg sollevati)</div>
                <Sparkline points={st.points} valueKey="vol" />
                <div style={{ fontSize: 13, color: C.muted, marginTop: 8 }}>
                  Totale complessivo {Math.round(totalVolume).toLocaleString("it-IT")} kg
                </div>
              </div>
            )}

            {st.points.length > 0 && (
              <>
                <div style={{ fontSize: 13, color: C.muted, margin: "22px 0 10px" }}>Ultime sessioni</div>
                {[...st.points]
                  .reverse()
                  .slice(0, 6)
                  .map((p, i) => (
                    <div key={i} style={{ ...rowCard, cursor: "default" }}>
                      <span style={{ fontSize: 14 }}>{fmtDate(p.date)}</span>
                      <span style={{ fontSize: 14, color: C.muted }}>
                        {p.reps} serie{p.top != null ? ` · top ${p.top}kg` : ""}
                      </span>
                    </div>
                  ))}
              </>
            )}

            <Btn tone="danger" size="md" style={{ width: "100%", marginTop: 24 }} onClick={() => onDelete(ex.id)}>
              Elimina esercizio
            </Btn>
          </div>
        );
      }

      function Stat({ label, value }) {
        return (
          <div style={{ ...cardBox, flex: 1, padding: "14px 12px", textAlign: "center" }}>
            <div
              style={{
                fontFamily: "'Barlow Condensed', sans-serif",
                fontSize: 30,
                fontWeight: 700,
                lineHeight: 1,
                fontVariantNumeric: "tabular-nums",
              }}
            >
              {value}
            </div>
            <div style={{ fontSize: 12, color: C.muted, marginTop: 5 }}>{label}</div>
          </div>
        );
      }

      /* ------------------------- backup e ripristino ----------------------- */

      const plur = (n, uno, molti) => `${n} ${n === 1 ? uno : molti}`;
      const descriviArchivio = (d) =>
        [
          plur(d.exercises.length, "esercizio", "esercizi"),
          plur(d.routines.length, "scheda", "schede"),
          plur(d.sessions.length, "allenamento", "allenamenti"),
          (d.programs || []).length ? plur(d.programs.length, "programma", "programmi") : null,
        ]
          .filter(Boolean)
          .join(" · ");

      const ERRORI_BACKUP = {
        json: "Il file non è leggibile. Controlla di aver scelto un backup di Gimmo e non un altro file.",
        "altra-app": "Questo file non è un backup di Gimmo.",
        futuro: "Il backup arriva da una versione più recente di Gimmo. Aggiorna l'app, poi riprova.",
        formato: "Il backup è incompleto o danneggiato: manca la struttura degli allenamenti.",
      };

      function DataSheet({ open, onClose, data, persistence, sessionInCorso, onRestore, onReset }) {
        const [esito, setEsito] = useState(null); // { tono, testo }
        const [incollato, setIncollato] = useState("");
        const [pending, setPending] = useState(null); // { data, exportedAt, merge }
        const [confermaSostituzione, setConfermaSostituzione] = useState(false);
        const [emergenze, setEmergenze] = useState([]);
        const fileRef = useRef(null);

        // Le copie di emergenza si rileggono a ogni apertura: sono poche e conviene
        // mostrarle aggiornate piuttosto che tenerle in memoria.
        useEffect(() => {
          if (!open) return;
          let vivo = true;
          listSalvataggiDiEmergenza().then((l) => vivo && setEmergenze(l));
          return () => {
            vivo = false;
          };
        }, [open, esito]);

        const chiudi = () => {
          setEsito(null);
          setPending(null);
          setIncollato("");
          setConfermaSostituzione(false);
          onClose();
        };

        const salvaFile = async () => {
          const testo = JSON.stringify(buildExport(data), null, 2);
          const r = await saveTextAsFile(exportFilename(), testo);
          if (r.ok && r.via === "annullato") return;
          setEsito(
            r.ok
              ? { tono: "ok", testo: "Backup salvato. Tienilo fuori dal telefono: una mail a te stesso basta." }
              : { tono: "stop", testo: "Il salvataggio del file non è riuscito. Usa «Copia il testo» e incollalo dove preferisci." }
          );
        };

        const copia = async () => {
          const ok = await copyText(JSON.stringify(buildExport(data)));
          setEsito(
            ok
              ? { tono: "ok", testo: "Backup copiato negli appunti." }
              : { tono: "stop", testo: "La copia non è riuscita. Salva il file, oppure riprova." }
          );
        };

        const leggiTesto = (testo) => {
          const r = parseBackup(testo);
          if (!r.ok) {
            setPending(null);
            setEsito({ tono: "stop", testo: ERRORI_BACKUP[r.reason] || ERRORI_BACKUP.formato });
            return;
          }
          const unione = mergeArchives(data, r.data);
          setEsito(null);
          setConfermaSostituzione(false);
          setPending({ data: r.data, exportedAt: r.exportedAt, merge: unione });
        };

        const scegliFile = async (e) => {
          const f = e.target.files && e.target.files[0];
          e.target.value = "";
          if (!f) return;
          try {
            const testo = f.text ? await f.text() : await new Promise((res, rej) => {
              const fr = new FileReader();
              fr.onload = () => res(String(fr.result));
              fr.onerror = () => rej(fr.error);
              fr.readAsText(f);
            });
            leggiTesto(testo);
          } catch (err) {
            setEsito({ tono: "stop", testo: "Il file non si è aperto. Riprova, oppure incolla il testo del backup." });
          }
        };

        const applica = async (nuovo, quanti) => {
          const r = await onRestore(nuovo);
          setPending(null);
          setIncollato("");
          setConfermaSostituzione(false);
          setEsito(
            r && r.ok
              ? { tono: "ok", testo: `Ripristino completato: ${quanti}. La copia precedente è stata messa da parte.` }
              : { tono: "stop", testo: "Il ripristino non è stato salvato. Controlla lo spazio sul dispositivo e riprova." }
          );
        };

        const scaricaEmergenza = async (voce) => {
          const raw = await readRaw(voce.key);
          if (!raw) {
            setEsito({ tono: "stop", testo: "La copia non è più disponibile." });
            return;
          }
          const nome = `gimmo-${voce.tipo}-${voce.at || "copia"}.json`;
          const r = await saveTextAsFile(nome, raw);
          if (!r.ok) await copyText(raw);
          setEsito({ tono: "ok", testo: r.ok ? "Copia salvata." : "Copia negli appunti." });
        };

        const bloccato = !!sessionInCorso;

        return (
          <Sheet open={open} onClose={chiudi} title="Backup e ripristino">
            {esito && (
              <div
                style={{
                  borderLeft: `3px solid ${esito.tono === "ok" ? C.green : C.red}`,
                  background: C.surface2,
                  padding: "10px 12px",
                  fontSize: 13,
                  lineHeight: 1.45,
                  marginBottom: 18,
                }}
              >
                {esito.testo}
              </div>
            )}

            <div style={{ fontSize: 13, color: C.muted, marginBottom: 6 }}>Nell'archivio</div>
            <div style={{ fontSize: 15, marginBottom: 22 }}>{descriviArchivio(data)}</div>

            <div style={sezioneTitolo}>Salva una copia</div>
            <p style={sezioneTesto}>
              Un file di testo con tutto: esercizi, schede e allenamenti. Si apre con qualsiasi editor e si rimette
              dentro da qui.
            </p>
            <div style={{ display: "flex", gap: 8, flexWrap: "wrap", marginBottom: 26 }}>
              <Btn tone="primary" size="md" onClick={salvaFile}>
                Salva il file
              </Btn>
              <Btn size="md" onClick={copia}>
                Copia il testo
              </Btn>
            </div>

            <div style={sezioneTitolo}>Ripristina da un backup</div>
            {bloccato ? (
              <div style={emptyBox}>
                C'è un allenamento in corso. Terminalo dalla scheda Allena prima di ripristinare, così le serie
                appena registrate non vanno perse.
              </div>
            ) : (
              <>
                <p style={sezioneTesto}>
                  Unire aggiunge solo quello che manca e non tocca nulla di esistente. Sostituire cancella l'archivio
                  attuale e mette al suo posto il backup.
                </p>
                <input
                  ref={fileRef}
                  type="file"
                  accept="application/json,.json,text/plain"
                  style={{ display: "none" }}
                  onChange={scegliFile}
                />
                <div style={{ display: "flex", gap: 8, flexWrap: "wrap", marginBottom: 12 }}>
                  <Btn size="md" onClick={() => fileRef.current && fileRef.current.click()}>
                    Scegli il file
                  </Btn>
                </div>
                <textarea
                  value={incollato}
                  onChange={(e) => setIncollato(e.target.value)}
                  placeholder="…oppure incolla qui il testo del backup"
                  rows={3}
                  style={{
                    width: "100%",
                    background: C.bg,
                    border: `1px solid ${C.line}`,
                    color: C.text,
                    borderRadius: 10,
                    padding: "10px 12px",
                    // Sotto i 16px iOS ingrandisce la pagina appena tocchi il campo,
                    // e non la rimpicciolisce più da sola.
                    fontSize: 16,
                    fontFamily: "inherit",
                    outline: "none",
                    boxSizing: "border-box",
                    resize: "vertical",
                    marginBottom: 10,
                  }}
                />
                <Btn size="md" disabled={!incollato.trim()} onClick={() => leggiTesto(incollato)}>
                  Leggi il testo incollato
                </Btn>
              </>
            )}

            {pending && !bloccato && (
              <div style={{ ...cardBox, marginTop: 16 }}>
                <div style={{ fontSize: 13, color: C.muted, marginBottom: 6 }}>
                  Backup {pending.exportedAt ? `del ${fmtDate(pending.exportedAt)}` : "senza data"}
                </div>
                <div style={{ fontSize: 15, marginBottom: 10 }}>{descriviArchivio(pending.data)}</div>
                <div style={{ fontSize: 13, color: C.muted, lineHeight: 1.5, marginBottom: 14 }}>
                  Unendolo si aggiungono {plur(pending.merge.added.sessions, "allenamento", "allenamenti")},{" "}
                  {plur(pending.merge.added.exercises, "esercizio", "esercizi")} e{" "}
                  {plur(pending.merge.added.routines, "scheda", "schede")}.
                </div>
                <div style={{ display: "flex", gap: 8, flexWrap: "wrap" }}>
                  <Btn
                    tone="primary"
                    size="md"
                    onClick={() =>
                      applica(
                        pending.merge.data,
                        `${plur(pending.merge.added.sessions, "allenamento aggiunto", "allenamenti aggiunti")}`
                      )
                    }
                  >
                    Unisci al mio archivio
                  </Btn>
                  {confermaSostituzione ? (
                    <Btn
                      tone="danger"
                      size="md"
                      onClick={() => applica(pending.data, `${descriviArchivio(pending.data)}`)}
                    >
                      Confermi? Sostituisci tutto
                    </Btn>
                  ) : (
                    <Btn size="md" onClick={() => setConfermaSostituzione(true)}>
                      Sostituisci tutto
                    </Btn>
                  )}
                </div>
              </div>
            )}

            {emergenze.length > 0 && (
              <>
                <div style={{ ...sezioneTitolo, marginTop: 30 }}>Copie messe da parte</div>
                <p style={sezioneTesto}>
                  Gimmo salva una copia ogni volta che trova un archivio illeggibile o prima di un ripristino.
                  Scaricale e tienile da parte: un file troncato è quasi sempre recuperabile a mano.
                </p>
                {emergenze.map((v) => (
                  <div key={v.key} style={{ ...rowCard, cursor: "default" }}>
                    <span>
                      <span style={{ display: "block", fontSize: 14 }}>
                        {v.tipo === "illeggibile" ? "Archivio illeggibile" : "Prima di un ripristino"}
                      </span>
                      <span style={{ display: "block", fontSize: 13, color: C.muted, marginTop: 2 }}>
                        {v.at ? fmtDate(new Date(v.at).toISOString()) : "data sconosciuta"}
                      </span>
                    </span>
                    <span style={{ display: "flex", gap: 6 }}>
                      <Btn size="sm" onClick={() => scaricaEmergenza(v)}>
                        Salva
                      </Btn>
                      <Btn
                        size="sm"
                        tone="danger"
                        onClick={async () => {
                          await removeKey(v.key);
                          setEmergenze((l) => l.filter((x) => x.key !== v.key));
                        }}
                      >
                        Elimina
                      </Btn>
                    </span>
                  </div>
                ))}
              </>
            )}

            {!persistence.writable && (
              <>
                <div style={{ ...sezioneTitolo, marginTop: 30, color: C.red }}>Riparti da zero</div>
                <p style={sezioneTesto}>
                  I salvataggi sono fermi perché l'archivio non è leggibile. Dopo aver messo al sicuro la copia qui
                  sopra, puoi svuotare l'archivio per tornare a registrare allenamenti.
                </p>
                <Btn
                  tone="danger"
                  size="md"
                  style={{ width: "100%" }}
                  onClick={async () => {
                    await onReset();
                    setEsito({ tono: "ok", testo: "Archivio svuotato. I salvataggi sono di nuovo attivi." });
                  }}
                >
                  Svuota l'archivio e riattiva i salvataggi
                </Btn>
              </>
            )}
          </Sheet>
        );
      }

      /* ------------------------------- Storico ----------------------------- */

      function HistoryView({ data, exName, persistence, sessionInCorso, onRestore, onReset }) {
        const [open, setOpen] = useState(null);
        const [dataSheet, setDataSheet] = useState(false);
        const sessions = [...data.sessions].sort((a, b) => new Date(b.startedAt) - new Date(a.startedAt));

        const weekCount = sessions.filter(
          (s) => Date.now() - new Date(s.startedAt).getTime() < 7 * 864e5
        ).length;
        const monthCount = sessions.filter(
          (s) => Date.now() - new Date(s.startedAt).getTime() < 30 * 864e5
        ).length;

        return (
          <div style={{ padding: "26px 18px" }}>
            <div style={{ display: "flex", justifyContent: "space-between", alignItems: "baseline", gap: 12 }}>
              <h1 style={h1}>Storico</h1>
              <Btn size="sm" onClick={() => setDataSheet(true)}>
                Backup
              </Btn>
            </div>

            <DataSheet
              open={dataSheet}
              onClose={() => setDataSheet(false)}
              data={data}
              persistence={persistence}
              sessionInCorso={sessionInCorso}
              onRestore={onRestore}
              onReset={onReset}
            />

            {sessions.length === 0 ? (
              <div style={emptyBox}>Nessun allenamento salvato. Il primo comparirà qui.</div>
            ) : (
              <>
                <div style={{ display: "flex", gap: 10, marginBottom: 22 }}>
                  <Stat label="Ultimi 7 giorni" value={weekCount} />
                  <Stat label="Ultimi 30 giorni" value={monthCount} />
                  <Stat label="Totali" value={sessions.length} />
                </div>

                {sessions.map((s) => {
                  const isOpen = open === s.id;
                  const nSets = s.entries.reduce((n, e) => n + e.sets.length, 0);
                  const vol = s.entries.reduce(
                    (n, e) => n + e.sets.reduce((m, x) => m + setVolume(x), 0),
                    0
                  );
                  return (
                    <div key={s.id} style={{ ...cardBox, marginBottom: 10 }}>
                      <button
                        onClick={() => setOpen(isOpen ? null : s.id)}
                        style={{
                          display: "flex",
                          width: "100%",
                          justifyContent: "space-between",
                          alignItems: "center",
                          background: "transparent",
                          border: "none",
                          color: C.text,
                          padding: 0,
                          cursor: "pointer",
                          fontFamily: "inherit",
                          textAlign: "left",
                        }}
                      >
                        <span>
                          <span style={{ display: "block", fontSize: 16, fontWeight: 600 }}>{s.name}</span>
                          <span style={{ display: "block", fontSize: 13, color: C.muted, marginTop: 3 }}>
                            {fmtDate(s.startedAt)} · {s.entries.length} esercizi · {nSets} serie
                            {vol > 0 ? ` · ${Math.round(vol).toLocaleString("it-IT")} kg` : ""}
                          </span>
                        </span>
                        <span style={{ color: C.muted, fontSize: 13 }}>{isOpen ? "▾" : "▸"}</span>
                      </button>

                      {isOpen && (
                        <div style={{ marginTop: 14, borderTop: `1px solid ${C.surface2}`, paddingTop: 12 }}>
                          {s.entries.map((e, i) => (
                            <div key={e.id} style={{ marginBottom: 12 }}>
                              <div style={{ fontSize: 14, fontWeight: 600, marginBottom: 6 }}>
                                <span style={{ color: C.muted, marginRight: 6 }}>{i + 1}</span>
                                {exName(e.exerciseId)}
                              </div>
                              <div style={{ display: "flex", flexWrap: "wrap", gap: 6 }}>
                                {e.sets.map((set, j) => (
                                  <span key={j} style={chip}>
                                    {fmtSet(set, true)}
                                  </span>
                                ))}
                              </div>
                            </div>
                          ))}
                        </div>
                      )}
                    </div>
                  );
                })}
              </>
            )}

            <div style={{ fontSize: 12, color: C.muted, textAlign: "center", marginTop: 28 }}>
              Gimmo · {APP_VERSION}
            </div>
          </div>
        );
      }

      /* ------------------------------- stili ------------------------------- */

      const h1 = {
        fontFamily: "'Barlow Condensed', sans-serif",
        fontSize: 34,
        fontWeight: 700,
        letterSpacing: "0.005em",
        margin: "0 0 8px",
        lineHeight: 1.05,
      };

      const cardBox = {
        background: C.surface,
        border: `1px solid #262E37`,
        borderRadius: 14,
        padding: "14px 14px",
      };

      const rowCard = {
        ...cardBox,
        display: "flex",
        width: "100%",
        alignItems: "center",
        justifyContent: "space-between",
        gap: 12,
        marginBottom: 10,
        color: C.text,
        fontFamily: "inherit",
        cursor: "pointer",
        textAlign: "left",
      };

      const emptyBox = {
        border: `1px dashed ${C.line}`,
        borderRadius: 12,
        padding: "18px 16px",
        color: C.muted,
        fontSize: 14,
        lineHeight: 1.5,
        marginBottom: 12,
      };

      const chip = {
        background: C.surface2,
        border: `1px solid ${C.line}`,
        borderRadius: 8,
        padding: "5px 9px",
        fontSize: 13,
        fontVariantNumeric: "tabular-nums",
      };

      const sezioneTitolo = {
        fontSize: 15,
        fontWeight: 600,
        marginBottom: 6,
      };

      const sezioneTesto = {
        fontSize: 13,
        color: C.muted,
        lineHeight: 1.5,
        margin: "0 0 12px",
      };

      const schermataAvvio = document.getElementById("avvio");
      try {
        ReactDOM.createRoot(document.getElementById("root")).render(<Gimmo />);
        if (schermataAvvio) schermataAvvio.remove();
      } catch (e) {
        const d = document.getElementById("dettaglio");
        if (d) {
          d.innerHTML =
            '<div class="dettaglio"><b>Gimmo non è riuscito ad aprirsi.</b>\n\n' +
            String((e && e.stack) || e) +
            "</div>";
        }
      }
    </script>
  </body>
</html>
