<!doctype html>
<html lang="it">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#12161B" />
    <meta name="color-scheme" content="dark" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Gimmo" />
    <title>Gimmo</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" />
    <style>
      :root { color-scheme: dark; }
      html, body, #root { height: 100%; }
      body {
        margin: 0;
        background: #12161b;
        color: #e9eef3;
        overscroll-behavior: none;
        -webkit-text-size-adjust: 100%;
      }
      @media (display-mode: standalone) {
        body { -webkit-user-select: none; user-select: none; }
        input, textarea { -webkit-user-select: text; user-select: text; }
      }
      #avvio {
        position: fixed; inset: 0; padding: 28px 22px;
        font-family: system-ui, -apple-system, sans-serif;
        font-size: 14px; line-height: 1.6; color: #8FA0B0;
        overflow-y: auto; -webkit-user-select: text; user-select: text;
      }
      #avvio h1 { font-size: 17px; color: #E9EEF3; margin: 0 0 16px; font-weight: 600; }
      #avvio .riga { display: flex; gap: 8px; margin-bottom: 4px; }
      #avvio .riga b { color: #E9EEF3; font-weight: 500; }
      #avvio .ok { color: #4FA96B; }
      #avvio .ko { color: #D95C55; }
      #avvio .dettaglio {
        margin-top: 18px; padding: 12px 14px; border-left: 3px solid #D95C55;
        background: #1B2128; color: #E9EEF3; font-size: 13px;
        white-space: pre-wrap; word-break: break-word;
      }
      #avvio .aiuto { margin-top: 14px; font-size: 13px; }
    </style>
  </head>
  <body>
    <div id="root"></div>

    <div id="avvio">
      <h1>Avvio di Gimmo</h1>
      <div id="passi"></div>
      <div id="dettaglio"></div>
    </div>

    <!-- ------------------------------------------------------------------
         VERSIONE DI PROVA.
         React e il traduttore del codice vengono scaricati da internet a ogni
         apertura: comoda per provare subito, lenta all'avvio e inutilizzabile
         senza rete. La versione definitiva si costruisce con Vite.

         Il caricamento è scritto a mano invece di usare semplici tag <script>
         per un motivo solo: se qualcosa non arriva, deve dirlo a schermo.
         Una pagina che resta bianca non si può riparare a distanza.
         ------------------------------------------------------------------ -->
    <script>
      (function () {
        var passi = document.getElementById("passi");
        var dettaglio = document.getElementById("dettaglio");
        var finito = false;

        function segna(testo) {
          var d = document.createElement("div");
          d.className = "riga";
          d.innerHTML = '<b>' + testo + '</b><span class="stato">…</span>';
          passi.appendChild(d);
          return d.querySelector(".stato");
        }

        function errore(titolo, dettagliTecnici, aiuto) {
          if (finito) return;
          finito = true;
          dettaglio.innerHTML =
            '<div class="dettaglio"><b>' + titolo + '</b>\n\n' + (dettagliTecnici || "") + "</div>" +
            (aiuto ? '<div class="aiuto">' + aiuto + "</div>" : "");
        }

        // Ogni libreria ha più indirizzi: se il primo non risponde si prova il
        // successivo. Le versioni sono fissate di proposito — "l'ultima
        // disponibile" è una variabile che non controlliamo.
        var LIBRERIE = [
          {
            nome: "React",
            controlla: function () { return typeof window.React !== "undefined"; },
            url: [
              "https://unpkg.com/react@18.3.1/umd/react.production.min.js",
              "https://cdn.jsdelivr.net/npm/react@18.3.1/umd/react.production.min.js"
            ]
          },
          {
            nome: "React DOM",
            controlla: function () { return typeof window.ReactDOM !== "undefined"; },
            url: [
              "https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js",
              "https://cdn.jsdelivr.net/npm/react-dom@18.3.1/umd/react-dom.production.min.js"
            ]
          },
          {
            nome: "Traduttore del codice",
            controlla: function () { return typeof window.Babel !== "undefined"; },
            url: [
              "https://unpkg.com/@babel/standalone@7.24.7/babel.min.js",
              "https://cdn.jsdelivr.net/npm/@babel/standalone@7.24.7/babel.min.js",
              "https://unpkg.com/@babel/standalone/babel.min.js"
            ]
          }
        ];

        function carica(lib, indice, stato, poi) {
          if (indice >= lib.url.length) {
            stato.textContent = "non arrivato";
            stato.className = "stato ko";
            errore(
              "Non riesco a scaricare " + lib.nome + ".",
              "Indirizzi provati:\n" + lib.url.join("\n"),
              "Quasi sempre è la connessione. Prova così, in ordine:<br>" +
                "1. controlla di essere online<br>" +
                "2. passa dal Wi-Fi ai dati (o viceversa)<br>" +
                "3. se sei sulla rete della palestra o dell'ufficio, potrebbe bloccare questi indirizzi: prova con i dati del telefono"
            );
            return;
          }
          var s = document.createElement("script");
          s.src = lib.url[indice];
          s.async = false;
          s.onload = function () {
            if (!lib.controlla()) {
              carica(lib, indice + 1, stato, poi);
              return;
            }
            stato.textContent = "ok";
            stato.className = "stato ok";
            poi();
          };
          s.onerror = function () { carica(lib, indice + 1, stato, poi); };
          document.head.appendChild(s);
        }

        function prossima(i) {
          if (i >= LIBRERIE.length) return avvia();
          var lib = LIBRERIE[i];
          var stato = segna("Scarico " + lib.nome);
          carica(lib, 0, stato, function () { prossima(i + 1); });
        }

        function avvia() {
          var stato = segna("Preparo l'app");
          try {
            // Babel cerca da solo i blocchi di codice da tradurre, ma solo se
            // è già presente quando la pagina finisce di caricarsi. Qui arriva
            // dopo, quindi glielo si chiede a mano.
            window.Babel.transformScriptTags();
            stato.textContent = "ok";
            stato.className = "stato ok";
          } catch (e) {
            stato.textContent = "errore";
            stato.className = "stato ko";
            errore(
              "Il codice di Gimmo non è stato tradotto correttamente.",
              String((e && e.message) || e),
              "Questo è un errore nel file: mandami il testo qui sopra."
            );
          }
        }

        window.addEventListener("error", function (ev) {
          var m = ev && ev.message ? ev.message : "errore sconosciuto";
          var dove = ev && ev.lineno ? "\n\nriga " + ev.lineno : "";
          errore("Gimmo si è fermato durante l'avvio.", m + dove, "Mandami il testo qui sopra.");
        });

        // Se dopo 25 secondi non è successo niente, meglio dirlo.
        setTimeout(function () {
          if (!document.getElementById("root").firstChild) {
            errore(
              "L'avvio sta impiegando troppo.",
              "Le librerie pesano circa 3 MB: con una connessione lenta può volerci un minuto.",
              "Aspetta ancora un po'. Se non cambia nulla, ricarica la pagina stando sotto Wi-Fi."
            );
          }
        }, 25000);

        prossima(0);
      })();
    </script>

    <script type="text/babel" data-presets="react">
      const { useState, useEffect, useRef, useCallback, useMemo } = React;

      /* ------------------------------------------------------------------ *
       * Gimmo — tracker allenamenti
       * Dati salvati localmente e persistenti tra le sessioni.
       * ------------------------------------------------------------------ */

      const DATA_KEY = "gimmo:data:v1";
      const ACTIVE_KEY = "gimmo:active:v1";
      const QUARANTINE_PREFIX = "gimmo:illeggibile:";

      // Versione della forma dei dati salvati, non dell'app.
      // Va alzata solo quando cambia la struttura di esercizi/schede/sessioni,
      // e ogni salto va gestito in migrate(): lo storico di un utente non si butta.
      const SCHEMA_VERSION = 1;

      const emptyData = () => ({
        schemaVersion: SCHEMA_VERSION,
        exercises: [],
        routines: [],
        sessions: [],
      });

      const C = {
        bg: "#12161B",
        surface: "#1B2128",
        surface2: "#232C36",
        line: "#333E4A",
        text: "#E9EEF3",
        muted: "#8FA0B0",
        blue: "#2A72E0",
        yellow: "#F2B441",
        green: "#4FA96B",
        red: "#D95C55",
      };

      const uid = () => Math.random().toString(36).slice(2, 10);
      const todayISO = () => new Date().toISOString();

      function fmtClock(ms) {
        const s = Math.max(0, Math.round(ms / 1000));
        return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}`;
      }
      function fmtRest(sec) {
        if (sec == null) return "—";
        if (sec < 60) return `${sec}s`;
        const m = Math.floor(sec / 60);
        const r = sec % 60;
        return r ? `${m}′${String(r).padStart(2, "0")}` : `${m}′`;
      }
      function fmtDate(iso) {
        const d = new Date(iso);
        return d.toLocaleDateString("it-IT", { day: "numeric", month: "short", year: "numeric" });
      }
      function fmtDateShort(iso) {
        return new Date(iso).toLocaleDateString("it-IT", { day: "2-digit", month: "2-digit" });
      }

      /* ----------------------------- persistenza ---------------------------- *
       * Gimmo deve girare in ambienti diversi (anteprima, browser, in futuro app
       * nativa) e in ognuno il posto dove salvare cambia. Qui sotto c'è un solo
       * punto di contatto con lo spazio di archiviazione: il resto dell'app non sa
       * e non deve sapere dove finiscono i dati.
       * Regola guida: un allenamento registrato non si perde e non si sovrascrive
       * mai in silenzio. Se qualcosa non torna, i salvataggi si fermano e l'utente
       * lo viene a sapere.
       * -------------------------------------------------------------------- */

      const memoryStore = new Map();

      const store = (() => {
        // 1. Ambiente di anteprima: espone window.storage.
        if (typeof window !== "undefined" && window.storage && typeof window.storage.get === "function") {
          return {
            kind: "preview",
            durable: true,
            get: async (k) => {
              const r = await window.storage.get(k);
              return r && r.value != null ? r.value : null;
            },
            set: async (k, v) => {
              await window.storage.set(k, v);
            },
            remove: async (k) => {
              await window.storage.delete(k);
            },
            list: async (prefix) => {
              const r = await window.storage.list(prefix);
              return r && Array.isArray(r.keys) ? r.keys : [];
            },
          };
        }

        // 2. Browser normale. La scrittura di prova non è superflua: in navigazione
        //    privata su Safari localStorage esiste ma scrivere lancia un errore, e
        //    scoprirlo adesso è meglio che scoprirlo a metà allenamento.
        try {
          if (typeof window !== "undefined" && window.localStorage) {
            const probe = "gimmo:prova";
            window.localStorage.setItem(probe, "1");
            window.localStorage.removeItem(probe);
            return {
              kind: "browser",
              durable: true,
              get: async (k) => window.localStorage.getItem(k),
              set: async (k, v) => window.localStorage.setItem(k, v),
              remove: async (k) => window.localStorage.removeItem(k),
              list: async (prefix) => {
                const out = [];
                for (let i = 0; i < window.localStorage.length; i++) {
                  const k = window.localStorage.key(i);
                  if (k && k.startsWith(prefix)) out.push(k);
                }
                return out;
              },
            };
          }
        } catch (e) {
          /* non disponibile: si scende al livello successivo */
        }

        // 3. Nessuno spazio scrivibile. L'app funziona comunque, ma i dati vivono
        //    solo finché la pagina resta aperta: durable a false accende l'avviso.
        return {
          kind: "memoria",
          durable: false,
          get: async (k) => (memoryStore.has(k) ? memoryStore.get(k) : null),
          set: async (k, v) => {
            memoryStore.set(k, v);
          },
          remove: async (k) => {
            memoryStore.delete(k);
          },
          list: async (prefix) => [...memoryStore.keys()].filter((k) => k.startsWith(prefix)),
        };
      })();

      // Legge una chiave distinguendo i tre casi che contano:
      // vuota (primo avvio), leggibile, illeggibile (dato corrotto).
      // La differenza non è accademica: su "vuota" si può scrivere, su
      // "illeggibile" no, altrimenti il salvataggio automatico cancella lo storico.
      async function readRecord(key) {
        let raw = null;
        try {
          raw = await store.get(key);
        } catch (e) {
          // window.storage.get solleva un errore quando la chiave non esiste
          // invece di restituire null: al primo avvio questo è il percorso normale.
          return { status: "vuoto" };
        }
        if (raw == null || raw === "") return { status: "vuoto" };
        try {
          return { status: "ok", value: JSON.parse(raw), raw };
        } catch (e) {
          return { status: "illeggibile", raw };
        }
      }

      async function writeRecord(key, value) {
        try {
          await store.set(key, JSON.stringify(value));
          return { ok: true };
        } catch (e) {
          const pieno =
            e &&
            (e.name === "QuotaExceededError" ||
              e.name === "NS_ERROR_DOM_QUOTA_REACHED" ||
              e.code === 22);
          console.error("gimmo: salvataggio fallito", store.kind, e);
          return { ok: false, reason: pieno ? "spazio" : "scrittura" };
        }
      }

      // Mette da parte una copia grezza del dato illeggibile prima di qualunque
      // altra operazione. Non serve all'app: serve a poter recuperare a mano.
      async function quarantine(raw) {
        try {
          await store.set(QUARANTINE_PREFIX + Date.now(), raw);
        } catch (e) {
          /* se non si riesce nemmeno a metterlo da parte, pazienza: non si scrive comunque */
        }
      }

      // Porta un dato salvato da una versione precedente alla forma corrente.
      // Oggi c'è un solo salto (schema assente → 1); la struttura a catena serve
      // perché i salti futuri si aggiungano senza toccare quelli vecchi.
      function migrate(stored) {
        if (!stored || typeof stored !== "object" || Array.isArray(stored)) {
          return { ok: false, reason: "formato" };
        }
        let d = stored;
        let v = typeof d.schemaVersion === "number" ? d.schemaVersion : 0;

        if (v === 0) {
          d = { ...d, schemaVersion: 1 };
          v = 1;
        }
        // if (v === 1) { d = migraA2(d); v = 2; }

        if (v > SCHEMA_VERSION) {
          // Dati scritti da una versione più recente di Gimmo: leggerli male e
          // risalvarli significherebbe rovinarli. Meglio fermarsi.
          return { ok: false, reason: "futuro" };
        }

        // Un campo assente è normale (archivio nuovo, o scritto da una versione che
        // ancora non lo aveva) e vale lista vuota. Un campo presente ma del tipo
        // sbagliato no: è il segno che il dato è rovinato, e azzerarlo in silenzio
        // vorrebbe dire cancellare lo storico. In quel caso ci si ferma.
        const campi = {};
        for (const nome of ["exercises", "routines", "sessions"]) {
          const v = d[nome];
          if (v === undefined || v === null) campi[nome] = [];
          else if (Array.isArray(v)) campi[nome] = v;
          else return { ok: false, reason: "formato" };
        }

        return { ok: true, data: { schemaVersion: SCHEMA_VERSION, ...campi } };
      }

      // Unico punto di ingresso al caricamento dell'archivio.
      // Restituisce anche se è lecito scrivere: chi chiama non deve ragionarci.
      async function loadArchive() {
        const rec = await readRecord(DATA_KEY);

        if (rec.status === "vuoto") {
          return { data: emptyData(), writable: true, issue: null };
        }
        if (rec.status === "illeggibile") {
          await quarantine(rec.raw);
          return { data: emptyData(), writable: false, issue: "illeggibile" };
        }

        const m = migrate(rec.value);
        if (!m.ok) {
          if (m.reason !== "futuro") await quarantine(rec.raw);
          return { data: emptyData(), writable: false, issue: m.reason === "futuro" ? "futuro" : "illeggibile" };
        }
        return { data: m.data, writable: true, issue: null };
      }

      // La sessione in corso è un dato di comodo, non l'archivio: se è rovinata si
      // scarta e si riparte, senza bloccare i salvataggi dello storico.
      async function loadActive() {
        const rec = await readRecord(ACTIVE_KEY);
        if (rec.status !== "ok") return null;
        const a = rec.value;
        return a && a.session && Array.isArray(a.session.entries) ? a : null;
      }

      /* ------------------------------- backup ------------------------------ *
       * Il backup non è una funzione accessoria: è l'unica cosa che rende
       * sopportabile un cambio di telefono, una cache svuotata da Safari o un
       * archivio finito in quarantena. Il file è leggibile a occhio di proposito,
       * così resta recuperabile anche senza Gimmo.
       * -------------------------------------------------------------------- */

      const EXPORT_FORMAT = 1;
      const ROLLBACK_PREFIX = "gimmo:prima-del-ripristino:";

      function buildExport(data) {
        return {
          app: "gimmo",
          exportFormat: EXPORT_FORMAT,
          exportedAt: todayISO(),
          data: { ...data, schemaVersion: SCHEMA_VERSION },
        };
      }

      function exportFilename(d = new Date()) {
        const p = (n) => String(n).padStart(2, "0");
        return `gimmo-${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}.json`;
      }

      // Accetta sia il file di backup completo sia l'archivio nudo: chi apre il file
      // e ne incolla un pezzo non deve essere punito per questo.
      function parseBackup(text) {
        let parsed;
        try {
          parsed = JSON.parse(text);
        } catch (e) {
          return { ok: false, reason: "json" };
        }
        if (!parsed || typeof parsed !== "object" || Array.isArray(parsed)) {
          return { ok: false, reason: "json" };
        }
        if (parsed.app && parsed.app !== "gimmo") return { ok: false, reason: "altra-app" };
        if (typeof parsed.exportFormat === "number" && parsed.exportFormat > EXPORT_FORMAT) {
          return { ok: false, reason: "futuro" };
        }
        const payload = parsed.data && typeof parsed.data === "object" ? parsed.data : parsed;
        const m = migrate(payload);
        if (!m.ok) return { ok: false, reason: m.reason };
        return { ok: true, data: m.data, exportedAt: typeof parsed.exportedAt === "string" ? parsed.exportedAt : null };
      }

      // Il confronto tra nomi deve perdonare quello che perdona l'occhio: spazi
      // doppi, maiuscole, apostrofi tipografici. "Panca  piana" e "panca piana"
      // sono lo stesso esercizio per chi si allena, e devono esserlo anche qui.
      const normName = (s) =>
        String(s || "")
          .replace(/[\u2018\u2019\u02BC]/g, "'")
          .replace(/\s+/g, " ")
          .trim()
          .toLowerCase();

      // Unisce due archivi senza creare doppioni. Il caso che conta davvero:
      // stesso esercizio creato su due telefoni con id diversi ma stesso nome.
      // Se non lo si gestisse, dopo un'unione ci si ritroverebbe due "Panca piana"
      // con lo storico spezzato a metà — il modo più veloce per far disinstallare l'app.
      function mergeArchives(current, incoming) {
        const exercises = [...current.exercises];
        const byId = new Map(exercises.map((e) => [e.id, e]));
        const byName = new Map(exercises.map((e) => [normName(e.name), e]));
        const remap = new Map();
        let nuoviEsercizi = 0;

        for (const e of incoming.exercises) {
          if (!e || !e.id) continue;
          if (byId.has(e.id)) {
            remap.set(e.id, e.id);
            continue;
          }
          const omonimo = byName.get(normName(e.name));
          if (omonimo) {
            remap.set(e.id, omonimo.id);
            continue;
          }
          exercises.push(e);
          byId.set(e.id, e);
          byName.set(normName(e.name), e);
          remap.set(e.id, e.id);
          nuoviEsercizi += 1;
        }

        const fix = (id) => remap.get(id) || id;

        const routines = [...current.routines];
        const routineIds = new Set(routines.map((r) => r.id));
        let nuoveSchede = 0;
        for (const r of incoming.routines) {
          if (!r || !r.id || routineIds.has(r.id)) continue;
          routines.push({ ...r, items: (r.items || []).map((it) => ({ ...it, exerciseId: fix(it.exerciseId) })) });
          routineIds.add(r.id);
          nuoveSchede += 1;
        }

        const sessions = [...current.sessions];
        const sessionIds = new Set(sessions.map((s) => s.id));
        let nuoviAllenamenti = 0;
        for (const s of incoming.sessions) {
          if (!s || !s.id || sessionIds.has(s.id)) continue;
          sessions.push({ ...s, entries: (s.entries || []).map((en) => ({ ...en, exerciseId: fix(en.exerciseId) })) });
          sessionIds.add(s.id);
          nuoviAllenamenti += 1;
        }

        sessions.sort((a, b) => new Date(a.startedAt) - new Date(b.startedAt));

        return {
          data: { schemaVersion: SCHEMA_VERSION, exercises, routines, sessions },
          added: { exercises: nuoviEsercizi, routines: nuoveSchede, sessions: nuoviAllenamenti },
        };
      }

      // Prima di sovrascrivere l'archivio con un ripristino si mette via com'era.
      // Costa una scrittura e vale un ripensamento.
      async function saveRollback(data) {
        try {
          await store.set(ROLLBACK_PREFIX + Date.now(), JSON.stringify(buildExport(data)));
        } catch (e) {
          /* non blocca il ripristino */
        }
      }

      async function listSalvataggiDiEmergenza() {
        const raccolta = [];
        for (const [prefix, tipo] of [
          [QUARANTINE_PREFIX, "illeggibile"],
          [ROLLBACK_PREFIX, "prima-del-ripristino"],
        ]) {
          let keys = [];
          try {
            keys = await store.list(prefix);
          } catch (e) {
            keys = [];
          }
          for (const k of keys) {
            const ts = Number(k.slice(prefix.length));
            raccolta.push({ key: k, tipo, at: Number.isFinite(ts) ? ts : null });
          }
        }
        return raccolta.sort((a, b) => (b.at || 0) - (a.at || 0));
      }

      async function readRaw(key) {
        try {
          return await store.get(key);
        } catch (e) {
          return null;
        }
      }

      async function removeKey(key) {
        try {
          await store.remove(key);
          return true;
        } catch (e) {
          return false;
        }
      }

      /* Salvataggio del file. Su iPhone il foglio di condivisione è l'unico modo
       * affidabile per far finire un file dentro l'app File o su iCloud; il download
       * classico resta per il desktop; il testo da copiare è la rete sotto la rete. */
      async function saveTextAsFile(filename, text) {
        const blob = new Blob([text], { type: "application/json" });

        try {
          if (typeof File !== "undefined" && navigator.canShare) {
            const file = new File([blob], filename, { type: "application/json" });
            if (navigator.canShare({ files: [file] })) {
              await navigator.share({ files: [file], title: filename });
              return { ok: true, via: "condivisione" };
            }
          }
        } catch (e) {
          if (e && e.name === "AbortError") return { ok: true, via: "annullato" };
        }

        try {
          const url = URL.createObjectURL(blob);
          const a = document.createElement("a");
          a.href = url;
          a.download = filename;
          document.body.appendChild(a);
          a.click();
          a.remove();
          setTimeout(() => URL.revokeObjectURL(url), 2000);
          return { ok: true, via: "download" };
        } catch (e) {
          return { ok: false };
        }
      }

      async function copyText(text) {
        try {
          if (navigator.clipboard && navigator.clipboard.writeText) {
            await navigator.clipboard.writeText(text);
            return true;
          }
        } catch (e) {
          /* si prova la via vecchia */
        }
        try {
          const ta = document.createElement("textarea");
          ta.value = text;
          ta.style.position = "fixed";
          ta.style.opacity = "0";
          document.body.appendChild(ta);
          ta.select();
          const ok = document.execCommand("copy");
          ta.remove();
          return ok;
        } catch (e) {
          return false;
        }
      }

      /* ---------------------------- statistiche ---------------------------- */

      function setVolume(s) {
        if (s.w == null || s.r == null) return 0;
        return s.w * s.r;
      }

      function exerciseStats(sessions, exerciseId) {
        const points = [];
        let best = null;
        let bestSet = null;
        let totalSets = 0;
        for (const ses of sessions) {
          for (const en of ses.entries) {
            if (en.exerciseId !== exerciseId || en.sets.length === 0) continue;
            let top = null;
            let vol = 0;
            for (const s of en.sets) {
              totalSets += 1;
              vol += setVolume(s);
              if (s.w != null && (top == null || s.w > top)) top = s.w;
              if (s.w != null && (best == null || s.w > best)) {
                best = s.w;
                bestSet = { ...s, date: ses.startedAt };
              }
            }
            points.push({ date: ses.startedAt, top, vol, reps: en.sets.length });
          }
        }
        points.sort((a, b) => new Date(a.date) - new Date(b.date));
        return { points, best, bestSet, totalSets, sessions: points.length };
      }

      function lastPerformance(sessions, exerciseId) {
        const ordered = [...sessions].sort((a, b) => new Date(b.startedAt) - new Date(a.startedAt));
        for (const ses of ordered) {
          for (const en of ses.entries) {
            if (en.exerciseId === exerciseId && en.sets.length) {
              return { date: ses.startedAt, sets: en.sets };
            }
          }
        }
        return null;
      }

      function Btn({ children, onClick, tone = "ghost", size = "md", style, disabled, ...rest }) {

      function Stepper({ value, onChange, step = 1, min = 0, suffix = "", decimals = 0, width = 92 }) {
        const dec = () => onChange(Math.max(min, +(value - step).toFixed(2)));
        const inc = () => onChange(+(value + step).toFixed(2));

            <button onClick={inc} aria-label="aumenta" style={stepBtn}>

      const miniBtn = {
        width: 34,
        height: 34,
        borderRadius: 8,
        background: C.surface2,
        border: `1px solid ${C.line}`,
        color: C.text,
        fontSize: 16,
        fontWeight: 500,
        cursor: "pointer",
        fontFamily: "inherit",
        flexShrink: 0,
        lineHeight: 1,
      };

      const stepBtn = {
        width: 44,
        height: 44,
        borderRadius: 10,
        background: C.surface2,
        border: `1px solid ${C.line}`,
        color: C.text,
        fontSize: 22,
        fontWeight: 500,
        cursor: "pointer",
        fontFamily: "inherit",
        flexShrink: 0,
      };

      function Sheet({ open, onClose, title, children }) {
        if (!open) return null;
        return (
          <div
            onClick={onClose}
            style={{
              position: "fixed",
              inset: 0,
              background: "rgba(6,9,12,.72)",
              zIndex: 60,
              display: "flex",
              alignItems: "flex-end",
              justifyContent: "center",
            }}
          >
            <div
              onClick={(e) => e.stopPropagation()}
              style={{
                background: C.surface,
                borderTop: `1px solid ${C.line}`,
                borderRadius: "16px 16px 0 0",
                width: "100%",
                maxWidth: 520,
                maxHeight: "86vh",
                overflowY: "auto",
                padding: "18px 18px 28px",
                boxSizing: "border-box",
              }}
            >
              <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 16 }}>
                <h2 style={{ margin: 0, fontSize: 19, fontWeight: 600 }}>{title}</h2>
                <Btn tone="quiet" size="sm" onClick={onClose}>
                  Chiudi
                </Btn>
